<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#06c755">
<title>หน้า admin — แก้ข้อมูลที่บอทเอาไปตอบ</title>
<!--
  หน้า admin: แก้ FAQ / เอกสาร / ข้อมูลติดต่ออาจารย์ / แผนการเรียน / วิชาบังคับก่อน
  และอ่านคำถามที่บอทตอบไม่ได้ (input ของการเขียน FAQ)

  ข้อตกลงด้านความปลอดภัยที่ห้ามแก้:
    * เข้าสู่ระบบด้วย **ชื่อผู้ใช้ + รหัสผ่าน** แล้วเซิร์ฟเวอร์ตั้ง cookie
      ``admin_session`` แบบ HttpOnly ให้เอง — หน้านี้อ่าน cookie นั้นไม่ได้และ
      ไม่ต้องอ่าน ทุก request แค่ส่ง cookie ไปด้วย (credentials: "same-origin")
    * ไม่เก็บชื่อผู้ใช้ / รหัสผ่าน / เซสชัน ลง localStorage/sessionStorage และ
      ไม่ใส่ลง URL — อยู่ในตัวแปรของหน้านี้เท่านั้น (หน้านี้เข้าจากคอมได้ ซึ่ง
      เป็นเครื่องที่มี extension ของคนอื่นอ่าน storage ได้ ส่วน query string
      ของ GET จะไปนอนอยู่ใน access log ของ uvicorn และของ cloudflared)
    * ทุก endpoint ที่ต้องมีสิทธิ์เป็น POST รวมทั้งตัวที่แค่อ่าน
    * ไม่มีปุ่มลบทั้งหน้า มีแต่ปุ่มเปิด/ปิด (``is_active``) — เพราะ scraper
      เขียนทับตารางเหล่านี้ได้ ลบจริงแล้วรอบ scrape ถัดไปจะเอากลับมาเงียบ ๆ

  ทำไมไฟล์เดียวไม่มี build step: ของที่ต้อง npm install ก่อนแก้ปุ่มเดียว จะไม่มี
  ใครแก้ต่อหลังส่งธีสิส — หน้านี้ต้องเปิดด้วย editor อะไรก็ได้แล้วแก้ได้ทันที
  ด้วยเหตุผลเดียวกัน CSS/JS อยู่ในไฟล์นี้ และของนอกที่โหลดมีแค่อย่างเดียว:
  ฟอนต์ไทยจาก Google Fonts (โหลดไม่ขึ้นก็อ่านได้ปกติ เพราะ fallback ไล่ไปหา
  ฟอนต์ไทยที่มีในเครื่องอยู่แล้ว)
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- โหลดฟอนต์แบบไม่บล็อกการวาดหน้า: เปิดผ่าน tunnel เน็ตอาจช้ามาก
     หน้าต้องขึ้นก่อนแล้วฟอนต์ค่อยมาทีหลัง (font-display=swap) -->
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
/* ── โทเคนของดีไซน์ ────────────────────────────────────────────────────────
   สีทุกตัวอยู่ที่นี่ที่เดียว และมีคู่ของโหมดมืดครบทุกตัว — สีที่ hard-code
   ในกฎข้างล่างคือสีที่ "จะพังในโหมดมืด" แบบที่ไม่มีใครเห็นจนกว่าจะเปิดกลางคืน

   หมายเหตุเรื่อง contrast: เขียว LINE (#06c755) สว่างเกินกว่าจะใส่ตัวอักษรขาว
   ทับได้ตามเกณฑ์ AA (ได้แค่ ~2:1) ปุ่มหลักในโหมดสว่างจึงใช้เขียวเข้ม
   --brand-ink (#06803b + ตัวอักษรขาว = 5.0:1) ส่วนโหมดมืดกลับด้าน คือใช้เขียว
   สดเป็นพื้นแล้วใส่ตัวอักษรเกือบดำทับ */
:root {
  color-scheme: light;
  --bg: #f2f4f7;
  --surface: #ffffff;
  --surface-2: #f7f9fb;
  --surface-3: #eef1f5;
  --border: #dde3ea;
  --border-strong: #c4ccd6;
  --text: #11151b;
  --text-dim: #4b5563;
  --text-faint: #6a7481;
  --brand: #06c755;
  --brand-ink: #06803b;
  --brand-on: #ffffff;
  --brand-text: #05702f;
  --brand-soft: #e7f8ee;
  --warn-bg: #fff8e1;
  --warn-border: #ecd48a;
  --warn-text: #6b4e00;
  --err-bg: #fdecea;
  --err-border: #f0b4ae;
  --err-text: #8c2318;
  --ok-bg: #e8f7ec;
  --ok-border: #a9dfb8;
  --ok-text: #145c2c;
  --focus: #1a6dff;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .05);
  --shadow-lg: 0 10px 30px rgba(16, 24, 40, .18);
  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 16px;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #10131a;
    --surface: #181c24;
    --surface-2: #1f242e;
    --surface-3: #262c38;
    --border: #2f3742;
    --border-strong: #414b59;
    --text: #e9edf3;
    --text-dim: #b3bcc8;
    --text-faint: #9aa4b1;
    --brand: #2ad86f;
    --brand-ink: #06c755;
    --brand-on: #05200f;
    --brand-text: #4fe08c;
    --brand-soft: #122b1d;
    --warn-bg: #322709;
    --warn-border: #5b4915;
    --warn-text: #f3dc9c;
    --err-bg: #3a1d1a;
    --err-border: #61302a;
    --err-text: #ffb8ae;
    --ok-bg: #10301e;
    --ok-border: #205c37;
    --ok-text: #86e2a7;
    --focus: #7fb0ff;
    --shadow: 0 1px 2px rgba(0, 0, 0, .5);
    --shadow-lg: 0 12px 34px rgba(0, 0, 0, .6);
  }
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  padding: 0 0 56px;
  /* fallback ไทยเรียงจาก "มีในเครื่องแน่ ๆ" ไปหาตัวสำรอง — ฟอนต์เว็บโหลดไม่ขึ้น
     แล้วต้องยังได้ฟอนต์ไทยที่มีหัวอ่านสบาย ไม่ใช่ตกไปที่ฟอนต์ default ของระบบ */
  font-family: "Noto Sans Thai", -apple-system, BlinkMacSystemFont, "Segoe UI",
               "Sarabun", "Leelawadee UI", "Thonburi", "Tahoma", sans-serif;
  font-size: 15px;
  line-height: 1.6;
  background: var(--bg);
  color: var(--text);
  /* ตัวเลขไทย/อารบิกในตารางต้องเรียงตรงหลัก ไม่งั้นอ่านคอลัมน์ปีที่/ภาคยาก */
  font-variant-numeric: tabular-nums;
}

:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
  border-radius: 4px;
}

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0;
}

/* ── แถบหัว ───────────────────────────────────────────────────────────────── */

.topbar { position: sticky; top: 0; z-index: 30; }
.appbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.appbar__inner {
  max-width: 1080px; margin: 0 auto;
  padding: 10px 14px;
  display: flex; align-items: center; gap: 10px;
}
.mark {
  flex: none; width: 34px; height: 34px; border-radius: 10px;
  background: var(--brand-soft); color: var(--brand-text);
  display: grid; place-items: center;
}
.mark svg { width: 20px; height: 20px; display: block; }
.appbar__title { min-width: 0; flex: 1; }
.appbar h1 {
  margin: 0; font-size: .98rem; font-weight: 700; line-height: 1.3;
  letter-spacing: -.01em;
}
.appbar .who {
  margin-top: 1px; font-size: .74rem; color: var(--text-faint);
  display: flex; align-items: center; gap: 6px;
}
.dot {
  flex: none; width: 7px; height: 7px; border-radius: 50%;
  background: var(--border-strong);
}
.dot--on { background: var(--brand); }
.dot--off { background: var(--err-text); }
/* จอแคบมาก: ปุ่มโหลดใหม่เหลือแค่ไอคอน เพื่อไม่ให้บีบหัวข้อจนตกบรรทัด
   (ข้อความยังอยู่ให้ screen reader อ่าน) */
@media (max-width: 439px) {
  #refresh .btnlabel, #logout .btnlabel {
    position: absolute; width: 1px; height: 1px;
    overflow: hidden; clip-path: inset(50%);
  }
  #refresh, #logout { padding: 6px 10px; }
}

/* ── แถบแท็บ ──────────────────────────────────────────────────────────────── */

.tabbar {
  background: var(--bg);
  border-bottom: 1px solid var(--border);
}
.tabbar__scroll {
  max-width: 1080px; margin: 0 auto;
  display: flex; gap: 6px;
  padding: 8px 14px;
  overflow-x: auto;
  scrollbar-width: none;
  scroll-snap-type: x proximity;
}
.tabbar__scroll::-webkit-scrollbar { display: none; }
.tab {
  flex: none; scroll-snap-align: start;
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 40px; padding: 6px 14px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--surface);
  color: var(--text-dim);
  font: inherit; font-size: .84rem; font-weight: 500;
  cursor: pointer;
  transition: background .12s ease, color .12s ease, border-color .12s ease;
}
.tab:hover { border-color: var(--border-strong); color: var(--text); }
.tab[aria-selected="true"] {
  background: var(--brand-ink); border-color: var(--brand-ink);
  color: var(--brand-on); font-weight: 600;
}
.tab .pill {
  font-size: .72rem; font-weight: 700;
  padding: 0 6px; border-radius: 999px;
  background: var(--surface-3); color: var(--text-dim);
}
.tab[aria-selected="true"] .pill {
  background: rgba(255, 255, 255, .22); color: var(--brand-on);
}

/* ── โครงเนื้อหา ─────────────────────────────────────────────────────────── */

.wrap { max-width: 1080px; margin: 0 auto; padding: 14px; }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow);
  margin-bottom: 14px;
  overflow: hidden;
}
.card__head {
  display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
  padding: 13px 15px;
  border-bottom: 1px solid var(--border);
  background: var(--surface-2);
}
.card__head h2 {
  margin: 0; font-size: .92rem; font-weight: 700; color: var(--text);
}
.card__head .sub { font-size: .76rem; color: var(--text-faint); }
.card__body { padding: 15px; }
.card--flush .card__body { padding: 0; }

/* ── กล่องข้อความ (คำเตือน / ผิดพลาด / สำเร็จ) ───────────────────────────── */

.msg {
  display: flex; gap: 9px; align-items: flex-start;
  border: 1px solid var(--warn-border);
  background: var(--warn-bg); color: var(--warn-text);
  border-radius: var(--r-md);
  padding: 10px 12px;
  font-size: .82rem;
  margin-bottom: 10px;
}
.msg svg { flex: none; width: 17px; height: 17px; margin-top: 2px; }
.msg--err { background: var(--err-bg); border-color: var(--err-border); color: var(--err-text); }
.msg--ok { background: var(--ok-bg); border-color: var(--ok-border); color: var(--ok-text); }
.msg--info {
  background: var(--surface-2); border-color: var(--border); color: var(--text-dim);
}
.msg b { font-weight: 600; }
.msg .detail {
  margin-top: 4px; font-size: .78rem; white-space: pre-wrap;
  font-variant-numeric: tabular-nums;
}

/* ── สรุปตัวเลข ──────────────────────────────────────────────────────────── */

.stats {
  display: grid; gap: 10px;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
}
.stat {
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 11px 12px;
  background: var(--surface-2);
}
.stat b {
  display: block; font-size: 1.45rem; font-weight: 700; line-height: 1.2;
  letter-spacing: -.02em;
}
.stat span { display: block; font-size: .76rem; color: var(--text-dim); }
.stat .meter {
  height: 5px; border-radius: 999px; background: var(--surface-3);
  margin-top: 8px; overflow: hidden;
}
.stat .meter > i { display: block; height: 100%; background: var(--brand); }
.stat--empty b { color: var(--warn-text); }
.stat--empty { background: var(--warn-bg); border-color: var(--warn-border); }

/* ── ฟอร์ม ───────────────────────────────────────────────────────────────── */

.grid {
  display: grid; gap: 12px;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
}
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.field > label {
  font-size: .8rem; font-weight: 600; color: var(--text);
  display: flex; align-items: baseline; gap: 5px; flex-wrap: wrap;
}
.field .req { color: var(--err-text); font-weight: 700; }
.field .hint { font-size: .74rem; color: var(--text-faint); line-height: 1.45; }
.field .rowline {
  display: flex; justify-content: space-between; gap: 10px; align-items: baseline;
}
.field .count {
  font-size: .72rem; color: var(--text-faint); white-space: nowrap;
}
.field .count--near { color: var(--warn-text); font-weight: 600; }
.field .count--over { color: var(--err-text); font-weight: 700; }
.field .fielderr {
  font-size: .76rem; color: var(--err-text); font-weight: 500;
}

/* ``input[type=search]`` ต้องอยู่ในลิสต์นี้ด้วย — ช่องค้นหาถูกสร้างจาก JS และ
   เคยตกหล่นจากกฎนี้ จึงเป็น input เปล่า ๆ ของเบราว์เซอร์ตัวเดียวในหน้า */
input[type=text], input[type=password], input[type=number], input[type=url],
input[type=email], input[type=search], textarea, select {
  font: inherit; font-size: .92rem;
  width: 100%;
  padding: 10px 11px;
  min-height: 44px;
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--r-sm);
  transition: border-color .12s ease, box-shadow .12s ease;
}
textarea { min-height: 120px; resize: vertical; line-height: 1.55; }
/* Safari/iOS วาด type=search เป็นแคปซูลของตัวเองทับ border/radius ข้างบน */
input[type=search] { -webkit-appearance: none; appearance: none; }
/* ปุ่มกากบาทที่ WebKit/Blink ใส่มาเอง — ต้องเอาออก ไม่ให้ซ้อนปุ่มล้างของเรา */
input[type=search]::-webkit-search-cancel-button,
input[type=search]::-webkit-search-decoration {
  -webkit-appearance: none; appearance: none; display: none;
}
input:hover, textarea:hover, select:hover { border-color: var(--text-faint); }
input:focus, textarea:focus, select:focus {
  border-color: var(--brand-ink);
  box-shadow: 0 0 0 3px var(--brand-soft);
  outline: none;
}
input[aria-invalid="true"], textarea[aria-invalid="true"] {
  border-color: var(--err-text);
}
input[readonly] {
  background: var(--surface-3); color: var(--text-dim); cursor: not-allowed;
}
.check {
  display: flex; align-items: center; gap: 10px;
  min-height: 44px; padding: 4px 2px; cursor: pointer;
  font-size: .86rem; font-weight: 500;
}
.check input[type=checkbox] {
  flex: none; width: 22px; height: 22px; margin: 0;
  accent-color: var(--brand-ink); cursor: pointer;
}

/* ── ปุ่ม ─────────────────────────────────────────────────────────────────── */

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  min-height: 44px; padding: 10px 18px;
  border: 1px solid transparent; border-radius: var(--r-sm);
  font: inherit; font-size: .88rem; font-weight: 600;
  cursor: pointer;
  background: var(--surface); color: var(--text);
  transition: background .12s ease, border-color .12s ease, opacity .12s ease;
}
.btn--primary { background: var(--brand-ink); color: var(--brand-on); }
.btn--primary:hover:not([disabled]) { filter: brightness(1.08); }
.btn--ghost { border-color: var(--border-strong); color: var(--text-dim); }
.btn--ghost:hover:not([disabled]) { background: var(--surface-2); color: var(--text); }
.btn--danger { border-color: var(--err-border); background: var(--err-bg); color: var(--err-text); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
/* display ของ .btn ทับ [hidden] ของเบราว์เซอร์ — ต้องเขียนคืนเอง ไม่งั้นปุ่ม
   บนแถบหัวโชว์ตั้งแต่ยังไม่ล็อกอิน */
.btn[hidden] { display: none; }
.btn--sm { min-height: 38px; padding: 6px 12px; font-size: .8rem; }
.btn svg { width: 15px; height: 15px; flex: none; }

.actions {
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border);
}
.actions .status {
  font-size: .8rem; color: var(--text-dim); min-height: 1.2em;
}

/* วงกลมหมุนตอนบันทึก — ใช้ CSS ล้วน ไม่มีไฟล์ภาพ/ไลบรารี */
.spin {
  width: 15px; height: 15px; flex: none;
  border: 2px solid currentColor; border-right-color: transparent;
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .001s !important; transition-duration: .001s !important; }
}

/* ── ตารางรายการ ──────────────────────────────────────────────────────────
   จอแคบ (ในแอป LINE) แถวหนึ่งกลายเป็นการ์ดที่มีป้ายชื่อคอลัมน์กำกับทุกค่า
   ไม่ใช่ตารางที่ต้องเลื่อนซ้ายขวาหาว่าตัวเลขนี้คือคอลัมน์ไหน — DOM ยังเป็น
   table จริงเพื่อให้ screen reader และการ copy ยังได้โครงตารางเดิม */

table.rows { width: 100%; border-collapse: collapse; }
table.rows th, table.rows td {
  text-align: left; vertical-align: top;
  padding: 10px 12px;
  font-size: .84rem;
}
table.rows thead th {
  font-size: .74rem; font-weight: 600; color: var(--text-faint);
  white-space: nowrap; background: var(--surface-2);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0;
}
table.rows tbody tr { border-top: 1px solid var(--border); }
table.rows tbody tr:first-child { border-top: 0; }
table.rows tbody tr.off { background: var(--surface-2); }
table.rows tbody tr:hover { background: var(--surface-2); }
td.nowrap { white-space: nowrap; }
td.clip { max-width: 320px; overflow-wrap: anywhere; }
td.wrapline { white-space: pre-wrap; overflow-wrap: anywhere; }
/* กลุ่มปุ่มในคอลัมน์จัดการ — ``align-items: stretch`` คือหัวใจ: ปุ่ม "แก้"
   (2 ตัวอักษร + ไอคอน) กับ "ปิดใช้" (6 ตัวอักษร) ต้องสูงเท่ากันเป๊ะ และ
   ``gap`` 10px คือระยะกันนิ้วพลาด — ปุ่มขวาคือปุ่มที่ทำให้บอทเลิกใช้ข้อมูล
   แถวนั้น การกดพลาดจึงมีราคา ไม่ใช่แค่เรื่องความสวย */
td.rowact { white-space: nowrap; }
.btnset { display: flex; align-items: stretch; gap: 10px; }
.btnset > .btn { margin: 0; min-width: 86px; height: auto; }
.rowlabel { display: none; }

/* ── ตัวกรอง/ค้นหาในหน้า (ไม่ยิง API ใหม่ กรองจากข้อมูลที่โหลดมาแล้ว) ───── */

.filterbar {
  display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end;
  padding: 12px 16px; border-bottom: 1px solid var(--border);
  background: var(--surface-2);
}
.filterbar .grow { flex-grow: 1; flex-shrink: 1; flex-basis: 260px; min-width: 180px; max-width: 460px; }
.filterbar label { display: block; font-size: .74rem; font-weight: 600; color: var(--text-faint); margin-bottom: 4px; }
.filterbar input { width: 100%; min-height: 44px; }
.filterbar select { min-height: 44px; }
.filterbar .btn { min-height: 44px; }
.filterbar .spread { flex: 1 1 100%; display: flex; gap: 10px; flex-wrap: wrap; }
.hitcount { font-size: .78rem; color: var(--text-dim); padding: 8px 16px 0; }
.hitcount b { color: var(--text); }

/* ── ช่องค้นหา ─────────────────────────────────────────────────────────────
   โครงเดียวกับ .pwwrap/.pwtoggle ของช่องรหัสผ่าน: กล่อง position:relative
   ครอบ input ที่เว้น padding ไว้สองข้าง แล้ววางไอคอน/ปุ่มทับตำแหน่งที่เว้นไว้
   ตัว input เองไม่มี class — มันได้หน้าตาจากกฎ input[type=search] ข้างบน
   ซึ่งเป็นกฎเดียวกับ input อื่นทั้งหน้า (สีจากโทเคน จึงถูกทั้งสองโหมดเอง) */
.searchfield { position: relative; display: flex; width: 100%; }
.searchfield input[type=search] { padding-left: 38px; padding-right: 46px; }
.searchicon {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  width: 17px; height: 17px; color: var(--text-faint); pointer-events: none;
}
.searchfield input[type=search]:focus ~ .searchicon { color: var(--brand-text); }
/* 44×44 = พื้นที่กดขั้นต่ำบนมือถือ พอดีกับความสูงขั้นต่ำของ input */
.searchclear {
  position: absolute; right: 0; top: 50%; transform: translateY(-50%);
  width: 44px; height: 44px; padding: 0;
  display: grid; place-items: center;
  border: 0; background: none; color: var(--text-faint);
  border-radius: var(--r-sm); cursor: pointer;
}
.searchclear:hover { color: var(--text); background: var(--surface-3); }
.searchclear[hidden] { display: none; }
.searchclear svg { width: 16px; height: 16px; display: block; }

/* ── แถบรีเฟรชเอง ─────────────────────────────────────────────────────────
   อยู่ในเนื้อหา ไม่ใช่ในแถบหัวที่ sticky — บนจอ 390px แถบหัว+แถบแท็บกินความสูง
   ไปมากแล้ว เพิ่มแถวที่สามค้างบนจอจะเหลือที่อ่านตารางไม่พอ */
.autobar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 2px 14px;
  margin-bottom: 12px; padding: 2px 12px;
  background: var(--surface-2);
  border: 1px solid var(--border); border-radius: var(--r-md);
}
.autobar[hidden] { display: none; }
.autobar .check { font-size: .8rem; font-weight: 500; }
.autobar .when { font-size: .76rem; color: var(--text-faint); }

/* ── หัวกลุ่มที่ยุบ/กางได้ ─────────────────────────────────────────────── */

tr.grouprow td { padding: 0; background: var(--surface-3); }
tr.grouprow:hover td { background: var(--surface-3); }
.grouphead {
  display: flex; align-items: center; gap: 10px; width: 100%;
  min-height: 46px; padding: 8px 14px;
  border: 0; background: none; color: var(--text);
  font: inherit; font-size: .84rem; font-weight: 700; text-align: left;
  cursor: pointer;
}
.grouphead:hover { background: var(--surface); }
/* ต้องกำหนดขนาด svg เอง — svg ที่ไม่มี width/height จะยืดเต็มกล่อง flex
   (เคยทำให้หัวกลุ่มสูง 1,000px) */
.grouphead .caret {
  flex: none; width: 16px; height: 16px;
  transition: transform .15s ease; color: var(--text-faint);
}
.grouphead[aria-expanded="true"] .caret { transform: rotate(90deg); }
.grouphead .count { font-weight: 600; font-size: .76rem; color: var(--text-dim); }
.grouphead .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }

/* ── ข้อความยาว: ตัดไว้ก่อน มีปุ่มกางเต็ม ───────────────────────────────── */

.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
  overflow: hidden; overflow-wrap: anywhere; }
.clamp--open { display: block; -webkit-line-clamp: unset; white-space: pre-wrap; }
.linkbtn {
  display: inline-flex; align-items: center; min-height: 32px; padding: 2px 0;
  margin-top: 2px; border: 0; background: none; cursor: pointer;
  font: inherit; font-size: .76rem; font-weight: 600;
  color: var(--brand-text); text-decoration: underline;
}
.rowmore { display: none; }
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: .72rem; font-weight: 600;
  padding: 2px 8px; border-radius: 999px;
  border: 1px solid var(--border-strong); color: var(--text-dim);
  background: var(--surface);
}
.badge--on { background: var(--ok-bg); border-color: var(--ok-border); color: var(--ok-text); }
.badge--off { background: var(--surface-3); color: var(--text-faint); }
a { color: var(--brand-text); overflow-wrap: anywhere; }

@media (max-width: 899px) {
  table.rows thead {
    position: absolute; width: 1px; height: 1px;
    overflow: hidden; clip-path: inset(50%);
  }
  table.rows, table.rows tbody, table.rows tr, table.rows td { display: block; width: 100%; }
  table.rows tbody tr {
    border: 1px solid var(--border); border-radius: var(--r-md);
    margin: 0 0 10px; padding: 10px 12px; background: var(--surface);
  }
  table.rows tbody tr.off { border-style: dashed; }
  table.rows td { padding: 6px 0; border-top: 1px dashed var(--border); }
  table.rows td:first-child { border-top: 0; padding-top: 0; }
  .rowlabel {
    display: block; font-size: .7rem; font-weight: 600;
    color: var(--text-faint); margin-bottom: 1px;
  }
  td.clip { max-width: none; }
  td.rowact { white-space: normal; padding-top: 10px; }
  td.rowact .btnset { width: 100%; }
  td.rowact .btnset > .btn { flex: 1 1 0; min-width: 0; min-height: 44px; }
  td.rowact .rowlabel { display: none; }
  /* บนจอแคบ แถวเริ่มแบบยุบ: เห็นกุญแจ + สถานะ + ปุ่ม แล้วค่อยกางดูรายละเอียด
     — สิ่งที่ต้องใช้ตัดสินใจว่าจะกดปิดใช้ไหม ต้องไม่ถูกซ่อน */
  tr.fold.closed td.detailcell { display: none; }
  .rowmore {
    display: inline-flex; align-items: center; gap: 6px;
    min-height: 40px; padding: 4px 0; margin-top: 4px;
    border: 0; background: none; color: var(--brand-text);
    font: inherit; font-size: .78rem; font-weight: 600; cursor: pointer;
  }
  .rowmore svg { width: 14px; height: 14px; transition: transform .15s ease; }
  .rowmore[aria-expanded="true"] svg { transform: rotate(90deg); }
}
@media (min-width: 900px) {
  .tablewrap { max-height: 68vh; overflow: auto; }
}

/* ── โครงกระดูกตอนโหลด ───────────────────────────────────────────────────── */

.skel {
  background: linear-gradient(90deg, var(--surface-3), var(--surface-2), var(--surface-3));
  background-size: 300% 100%;
  animation: shimmer 1.3s ease-in-out infinite;
  border-radius: 6px; height: 14px; margin-bottom: 9px;
}
.skel--wide { width: 100%; }
.skel--half { width: 55%; }
.skel--tall { height: 46px; }
@keyframes shimmer {
  0% { background-position: 100% 0; }
  100% { background-position: 0 0; }
}

/* ── สถานะว่างเปล่า ──────────────────────────────────────────────────────── */

.empty { text-align: center; padding: 26px 16px; }
.empty .icon {
  width: 44px; height: 44px; margin: 0 auto 10px;
  border-radius: 12px; background: var(--surface-3); color: var(--text-faint);
  display: grid; place-items: center;
}
.empty .icon svg { width: 24px; height: 24px; }
.empty h3 { margin: 0 0 6px; font-size: .92rem; font-weight: 700; }
.empty p {
  margin: 0 auto; max-width: 46ch;
  font-size: .82rem; color: var(--text-dim); line-height: 1.6;
}
.empty .steps {
  margin: 12px auto 0; max-width: 46ch; text-align: left;
  font-size: .82rem; color: var(--text-dim);
  padding-left: 1.3em;
}
.empty .steps li { margin-bottom: 4px; }

/* ── หน้าจอเข้าสู่ระบบ ────────────────────────────────────────────────────
   <dialog> ตัวเดียวใช้ทั้งตอนเปิดหน้า (ยังไม่ล็อกอิน) และตอนเซสชันหมดกลางทาง
   — ตอนหมดกลางทางมันซ้อนขึ้นบนหน้าเดิม หน้าไม่ถูกโหลดใหม่ ร่างที่พิมพ์ค้างไว้
   จึงอยู่ครบ (สีทุกตัวมาจากโทเคนด้านบน โหมดมืดจึงมาเองไม่ต้องเขียนซ้ำ) */

dialog.gate {
  border: 1px solid var(--border); border-radius: var(--r-lg);
  padding: 0; width: min(420px, calc(100vw - 24px));
  background: var(--surface); color: var(--text);
  box-shadow: var(--shadow-lg);
}
/* เบราว์เซอร์ที่ไม่รู้จัก <dialog> ต้องไม่โชว์กล่องนี้ค้างไว้ตอนปิด */
dialog.gate:not([open]) { display: none; }
dialog.gate::backdrop { background: rgba(8, 11, 16, .62); }
.gate__head { display: flex; align-items: center; gap: 11px; padding: 18px 18px 0; }
.gate__head h2 { margin: 0; font-size: 1.02rem; font-weight: 700; line-height: 1.35; }
.gate__head p { margin: 2px 0 0; }
.gate__body {
  padding: 15px 18px 2px;
  display: flex; flex-direction: column; gap: 13px;
}
.gate__body .msg { margin-bottom: 0; }
.gate__foot {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 14px 18px 18px;
}
.gate__foot .btn { flex: 1 1 auto; }
.gate__foot .status { font-size: .8rem; color: var(--text-dim); }
/* ช่องรหัสผ่าน + ปุ่มรูปตาวางทับด้านขวาในกรอบเดียวกัน (สูงเท่าช่อง = 44px) */
.pwwrap { position: relative; display: flex; }
.pwwrap input { padding-right: 50px; }
.pwtoggle {
  position: absolute; top: 0; right: 0; bottom: 0;
  width: 46px; min-height: 44px;
  display: grid; place-items: center;
  background: none; border: 0; border-radius: var(--r-sm);
  color: var(--text-faint); cursor: pointer;
}
.pwtoggle:hover { color: var(--text); }
.pwtoggle[aria-pressed="true"] { color: var(--brand-text); }
.pwtoggle svg { width: 20px; height: 20px; display: block; }
.pwtoggle .pwslash { display: none; }
.pwtoggle[aria-pressed="true"] .pwslash { display: inline; }

/* ── กล่องยืนยัน ─────────────────────────────────────────────────────────── */

dialog.sheet {
  border: 1px solid var(--border); border-radius: var(--r-lg);
  padding: 0; width: min(440px, calc(100vw - 28px));
  background: var(--surface); color: var(--text);
  box-shadow: var(--shadow-lg);
}
dialog.sheet::backdrop { background: rgba(8, 11, 16, .55); }
dialog.sheet .body { padding: 18px 18px 6px; }
dialog.sheet h2 { margin: 0 0 8px; font-size: 1rem; }
dialog.sheet p { margin: 0 0 10px; font-size: .85rem; color: var(--text-dim); }
dialog.sheet .keyline {
  font-size: .8rem; background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--r-sm); padding: 8px 10px; overflow-wrap: anywhere;
}
dialog.sheet .foot {
  display: flex; gap: 10px; justify-content: flex-end;
  padding: 14px 18px 18px;
}
dialog.sheet .foot .btn { flex: 1; }
@media (min-width: 520px) { dialog.sheet .foot .btn { flex: none; } }

.muted { color: var(--text-dim); font-size: .82rem; }
.tiny { font-size: .76rem; color: var(--text-faint); }
code {
  background: var(--surface-3); color: var(--text);
  padding: 1px 5px; border-radius: 4px; font-size: .88em;
}
.legend {
  display: flex; flex-wrap: wrap; gap: 6px 14px;
  font-size: .76rem; color: var(--text-faint); margin-top: 12px;
}
.stack > * + * { margin-top: 12px; }
</style>
</head>
<body>
<a class="sr-only" href="#main">ข้ามไปที่เนื้อหา</a>
<div class="topbar">
<header class="appbar">
  <div class="appbar__inner">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3l8 4v5c0 4.5-3.2 7.9-8 9-4.8-1.1-8-4.5-8-9V7z"></path>
        <path d="M9 12l2 2 4-4"></path>
      </svg>
    </div>
    <div class="appbar__title">
      <h1>คลังคำตอบของบอท</h1>
      <div class="who">
        <span class="dot" id="statedot"></span>
        <span id="whotext">กำลังเตรียมหน้า…</span>
      </div>
    </div>
    <button class="btn btn--ghost btn--sm" id="refresh" type="button" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12a9 9 0 1 1-3-6.7"></path><path d="M21 4v5h-5"></path>
      </svg>
      <span class="btnlabel">โหลดใหม่</span>
    </button>
    <button class="btn btn--ghost btn--sm" id="logout" type="button" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M14 4h5v16h-5"></path><path d="M10 8l-4 4 4 4"></path>
        <path d="M6 12h8"></path>
      </svg>
      <span class="btnlabel">ออกจากระบบ</span>
    </button>
  </div>
</header>

<nav class="tabbar" id="tabbar" hidden aria-label="หมวดข้อมูล">
  <div class="tabbar__scroll" id="tabs" role="tablist"></div>
</nav>
</div>

<main class="wrap" id="main">
  <!-- ข้อความผลลัพธ์ทุกตัวลงกล่องนี้ และเป็น aria-live เพื่อให้คนที่ใช้
       screen reader ได้ยินว่าบันทึกผ่านหรือไม่ผ่านโดยไม่ต้องไล่หาเอง -->
  <div id="notices" role="status" aria-live="polite"></div>
  <!-- รีเฟรชเอง: ค่าเริ่มต้นเปิด และจำสถานะของสวิตช์นี้ไว้ข้ามการโหลดหน้า
       ที่เก็บใน localStorage มีคีย์เดียวคือ boolean ของสวิตช์นี้ ไม่มีชื่อผู้ใช้
       ไม่มีเซสชัน ไม่มีเนื้อข้อมูลของหลักสูตร (ดูข้อตกลงด้านบนของไฟล์) -->
  <div class="autobar" id="autobar" hidden>
    <label class="check" for="autotoggle">
      <input type="checkbox" id="autotoggle">
      <span>โหลดข้อมูลใหม่เองทุก 60 วินาที</span>
    </label>
    <span class="when" id="autowhen">ยังไม่ได้โหลดใหม่</span>
  </div>
  <div id="view"></div>
</main>

<!-- หน้าจอเข้าสู่ระบบ: ใช้ทั้งตอนเปิดหน้าและตอนเซสชันหมดกลางทาง
     เป็น <form> จริงเพื่อให้ Enter ในช่องรหัสผ่าน submit ได้ และให้ตัวจำ
     รหัสผ่านของเบราว์เซอร์ทำงาน (autocomplete=username/current-password)
     ค่าที่พิมพ์อยู่ในตัวแปรของหน้านี้เท่านั้น ไม่ลงที่เก็บข้อมูลและไม่ลง URL -->
<dialog class="gate" id="gate" aria-labelledby="gatetitle">
  <form id="gateform" novalidate>
    <div class="gate__head">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3l8 4v5c0 4.5-3.2 7.9-8 9-4.8-1.1-8-4.5-8-9V7z"></path>
          <path d="M9 12l2 2 4-4"></path>
        </svg>
      </div>
      <div>
        <h2 id="gatetitle">เข้าสู่ระบบผู้ดูแล</h2>
        <p class="tiny" id="gatesub">ใช้ชื่อผู้ใช้และรหัสผ่านของผู้ดูแลระบบ</p>
      </div>
    </div>
    <div class="gate__body">
      <!-- คำเตือนที่รู้ตั้งแต่เปิดหน้า (เช่น เซิร์ฟเวอร์ยังไม่มีบัญชี) -->
      <div id="gatenotice" aria-live="polite"></div>
      <div class="field">
        <label for="gateuser">ชื่อผู้ใช้</label>
        <input id="gateuser" name="username" type="text" autocomplete="username"
               autocapitalize="none" autocorrect="off" spellcheck="false"
               enterkeyhint="next" required>
      </div>
      <div class="field">
        <label for="gatepass">รหัสผ่าน</label>
        <div class="pwwrap">
          <input id="gatepass" name="password" type="password"
                 autocomplete="current-password" enterkeyhint="go" required>
          <button class="pwtoggle" type="button" id="gateeye"
                  aria-pressed="false" aria-controls="gatepass">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 12s3.6-6.2 10-6.2S22 12 22 12s-3.6 6.2-10 6.2S2 12 2 12z"></path>
              <path d="M12 14.6a2.6 2.6 0 100-5.2 2.6 2.6 0 000 5.2z"></path>
              <path class="pwslash" d="M4 20L20 4"></path>
            </svg>
            <span class="sr-only" id="gateeyelabel">แสดงรหัสผ่าน</span>
          </button>
        </div>
        <div class="hint">พิมพ์บนมือถือแล้วพิมพ์ผิดง่าย — กดรูปตาเพื่อดูว่าพิมพ์ถูกไหม</div>
      </div>
      <!-- role=alert เพื่อให้ screen reader ได้ยินข้อความผิดพลาดทันที -->
      <div id="gateerr" role="alert"></div>
    </div>
    <div class="gate__foot">
      <button class="btn btn--primary" type="submit" id="gatesubmit">เข้าสู่ระบบ</button>
      <span class="status" id="gatestatus"></span>
    </div>
  </form>
</dialog>

<!-- กล่องยืนยันก่อนปิดใช้แถว — ใช้ <dialog> ของเบราว์เซอร์ (โฟกัสวนในกล่อง
     และปิดด้วย Esc ได้เอง) ถ้าเบราว์เซอร์เก่าไม่มี showModal จะถอยไปใช้
     window.confirm ให้ยังยืนยันได้เสมอ ไม่ใช่ปิดทันทีโดยไม่ถาม -->
<dialog class="sheet" id="confirmbox" aria-labelledby="confirmtitle">
  <div class="body">
    <h2 id="confirmtitle">ยืนยัน</h2>
    <p id="confirmtext"></p>
    <div class="keyline" id="confirmkey"></div>
  </div>
  <div class="foot">
    <button class="btn btn--ghost" type="button" id="confirmno">ยกเลิก</button>
    <button class="btn btn--danger" type="button" id="confirmyes">ยืนยัน</button>
  </div>
</dialog>

<script>
"use strict";

// ── สถานะของหน้า ────────────────────────────────────────────────────────────

// ชื่อผู้ใช้ที่ล็อกอินอยู่ — ใช้แสดงบนแถบหัวเท่านั้น ตัวตนจริงคือ cookie
// ``admin_session`` แบบ HttpOnly ที่เซิร์ฟเวอร์ตั้งให้ (หน้านี้อ่านไม่ได้)
// และไม่มีการเก็บชื่อผู้ใช้/รหัสผ่านลงที่เก็บข้อมูลของเบราว์เซอร์เลย
let adminUser = null;
// เวลาหมดอายุของเซสชันเป็น ms — คำนวณจาก ``expires_in`` ที่ /login คืนมา
let sessionExpiresAt = null;
// เตือนเรื่องเซสชันใกล้หมดแล้วหรือยัง — เตือนครั้งเดียวพอ
let expiryWarned = false;
// ผูก listener ของปุ่มบนแถบหัวแล้วหรือยัง (ล็อกอินหลายรอบได้ในหน้าเดียว)
let appWired = false;
// ตัวจับเวลาเตือนก่อนเซสชันหมด — ตั้งครั้งเดียว
let sessionWatch = null;
// ผลของ /api/admin/state ทั้งก้อน — โหลดครั้งเดียวแล้วสลับแท็บในหน้าได้เลย
let state = null;
let activeTab = "summary";
// โหลดแยกเพราะเป็นตารางที่โตเรื่อย ๆ (คำถามที่นักศึกษาพิมพ์เอง ต้อง "กดดู")
let chatLogs = null;
// แถวที่กำลังแก้อยู่ของแต่ละแท็บ — ใช้บอกบนหัวฟอร์มว่ากำลังแก้ของเดิม
// ไม่ใช่กำลังเพิ่มใหม่ (จุดที่คนเผลอสร้างแถวซ้ำเพราะไม่รู้ว่าอยู่โหมดไหน)
let editingKey = null;

};

function icon(name) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("fill", "none");
  svg.setAttribute("stroke", "currentColor");
  svg.setAttribute("stroke-width", "1.8");
  svg.setAttribute("stroke-linecap", "round");
  svg.setAttribute("stroke-linejoin", "round");
  svg.setAttribute("aria-hidden", "true");
  const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
  path.setAttribute("d", ICONS[name] || ICONS.info);
  svg.appendChild(path);
  return svg;
}

// ── ข้อความผลลัพธ์ ──────────────────────────────────────────────────────────

/**
 * kind: "warn" (ดีฟอลต์) | "err" | "ok" | "info"
 * detail: บรรทัดรายละเอียดใต้ข้อความหลัก (เช่น รายการช่องที่เปลี่ยนไปจริง)
 */
function notice(text, kind, detail) {
  const box = document.createElement("div");
  box.className = "msg" + (kind ? " msg--" + kind : "");
  box.appendChild(icon(kind === "err" ? "err" : kind === "ok" ? "ok" : kind === "info" ? "info" : "warn"));
  const body = document.createElement("div");
  const head = document.createElement("b");
  head.textContent = text;
  body.appendChild(head);
  if (detail) {
    const more = document.createElement("div");
    more.className = "detail";
    more.textContent = detail;
    body.appendChild(more);
  }
  box.appendChild(body);
  el("notices").appendChild(box);
  return box;
}

function clearNotices() {
  el("notices").textContent = "";
}

/** กล่องข้อความแบบอยู่ในการ์ด (ไม่ใช่กล่องผลลัพธ์ด้านบนหน้า) */
function inlineMsg(message, kind) {
  const box = document.createElement("div");
  box.className = "msg" + (kind ? " msg--" + kind : "");
  box.appendChild(icon(kind === "err" ? "err" : kind === "ok" ? "ok" : kind === "warn" ? "warn" : "info"));
  const body = document.createElement("div");
  body.textContent = message;
  box.appendChild(body);
  return box;
}

// ── เซสชันของผู้ดูแล ────────────────────────────────────────────────────────
//
// ตัวยืนยันตัวตนคือ cookie ``admin_session`` แบบ HttpOnly ที่เซิร์ฟเวอร์ตั้งให้
// ตอนล็อกอินสำเร็จ — หน้านี้อ่านค่าใน cookie ไม่ได้และไม่ต้องอ่าน ที่นี่เก็บแค่
// สองอย่างไว้แสดงบนแถบหัว: ชื่อผู้ใช้ และเวลาหมดอายุที่คำนวณจาก ``expires_in``
// ที่ /api/admin/login คืนมา (ไม่มี JWT ให้แกะ exp เองแล้ว)

const WARN_BEFORE_MS = 5 * 60 * 1000;   // เตือนก่อนเซสชันหมด 5 นาที
const EXPIRED_TEXT =
  "เซสชันหมดอายุ — เข้าสู่ระบบในกล่องที่ขึ้นมาแล้วกดอีกครั้ง " +
  "หน้านี้ไม่ถูกโหลดใหม่ ข้อความที่พิมพ์ค้างไว้ยังอยู่ครบ";

/** นาทีที่เหลือของเซสชัน — null เมื่อไม่รู้ (เซิร์ฟเวอร์ไม่ส่ง expires_in มา) */
function sessionMinsLeft() {
  if (sessionExpiresAt === null) return null;
  return Math.max(0, Math.round((sessionExpiresAt - Date.now()) / 60000));
}

/** บรรทัดสถานะบนแถบหัว: ใครล็อกอินอยู่ · หลักสูตร · เซสชันเหลือเท่าไร */
function whoLine() {
  const left = sessionMinsLeft();
  return `เข้าสู่ระบบเป็น ${adminUser}` +
    (state && state.program_code ? ` · หลักสูตร ${state.program_code}` : "") +
    " · การแก้ทุกครั้งถูกบันทึกไว้" +
    (left === null ? "" : ` · เซสชันเหลือ ${left} นาที`);
}

/** มีอะไรที่ผู้ใช้พิมพ์ค้างอยู่ในฟอร์มไหม (ใช้ถามก่อนออกจากระบบ) */
function hasDraft() {
  const form = document.querySelector("#view form");
  if (!form) return false;
  return Array.from(form.elements).some((node) => {
    if (!node.name || node.type === "hidden" || node.readOnly) return false;
    if (node.type === "checkbox") return false;
    // program_code ถูกเติมให้อัตโนมัติ ไม่ใช่สิ่งที่คนพิมพ์
    if (node.name === "program_code") return false;
    return String(node.value || "").trim() !== "";
  });
}

// ── กล่องเข้าสู่ระบบ ────────────────────────────────────────────────────────
//
// **ห้ามรีโหลดหน้าหรือเด้งไปที่อื่นเมื่อเซสชันหมด** ของเดิมพาไปหน้าล็อกอินเอง
// แล้วเกิดสองปัญหาพร้อมกัน: วนล็อกอินไม่จบ และร่างที่พิมพ์ค้างหายทั้งหมด
// ที่นี่กล่องล็อกอินซ้อนขึ้นบนหน้าเดิม DOM ใต้กล่องไม่ถูกแตะเลย สิ่งที่พิมพ์ค้าง
// จึงอยู่ครบ ล็อกอินเสร็จกล่องปิด แล้วกดปุ่มเดิมซ้ำได้ทันทีจากที่ค้างไว้

/** คำเตือนบนกล่องล็อกอิน (สิ่งที่รู้ก่อนกดปุ่ม เช่น เซิร์ฟเวอร์ยังไม่มีบัญชี) */
function gateHint(message, kind, detail) {
  fillMsgBox(el("gatenotice"), message, kind || "warn", detail);
}

/** ข้อความผิดพลาดของการล็อกอิน — อยู่ในกล่อง role="alert" */
function gateError(message, detail) {
  fillMsgBox(el("gateerr"), message, "err", detail);
}

function fillMsgBox(box, message, kind, detail) {
  box.textContent = "";
  if (!message) return;
  const msg = inlineMsg(message, kind);
  if (detail) {
    const more = document.createElement("div");
    more.className = "detail";
    more.textContent = detail;
    msg.lastChild.appendChild(more);
  }
  box.appendChild(msg);
}

/** สลับ "แสดงรหัสผ่าน" — พิมพ์รหัสบนมือถือแล้วพิมพ์ผิดง่าย ต้องมองเห็นได้ */
function setPasswordVisible(visible) {
  const input = el("gatepass");
  const button = el("gateeye");
  const label = visible ? "ซ่อนรหัสผ่าน" : "แสดงรหัสผ่าน";
  input.type = visible ? "text" : "password";
  button.setAttribute("aria-pressed", visible ? "true" : "false");
  button.title = label;
  el("gateeyelabel").textContent = label;
}

/**
 * เปิดกล่องล็อกอิน — ``hint`` เป็น {text, kind, detail} หรือ null
 * ใช้ ``showModal`` เพื่อให้โฟกัสวนอยู่ในกล่องและพื้นหลังกดไม่ได้
 */
function showGate(hint) {
  const box = el("gate");
  gateError("");
  el("gatestatus").textContent = "";
  el("gatepass").value = "";
  setPasswordVisible(false);
  gateHint(hint ? hint.text : "", hint ? hint.kind : null, hint ? hint.detail : "");
  el("gatetitle").textContent = adminUser ? "เข้าสู่ระบบอีกครั้ง" : "เข้าสู่ระบบผู้ดูแล";
  if (!box.open) {
    if (typeof box.showModal === "function") box.showModal();
    else box.setAttribute("open", "");   // เบราว์เซอร์เก่าที่ไม่มี showModal
  }
  // เปิดหน้ามาโฟกัสช่องชื่อผู้ใช้ — ถ้ารู้ชื่ออยู่แล้ว (ล็อกอินซ้ำ) ไปที่ช่องรหัสผ่าน
  const first = el("gateuser").value.trim() ? el("gatepass") : el("gateuser");
  first.focus();
}

function hideGate() {
  const box = el("gate");
  el("gatepass").value = "";   // ไม่เก็บรหัสผ่านค้างไว้ใน DOM
  setPasswordVisible(false);
  if (typeof box.close === "function" && box.open) box.close();
  else box.removeAttribute("open");
}

/**
 * ข้อความของแต่ละสถานะ — **401 ห้ามเดาว่าผิดช่องไหน** เซิร์ฟเวอร์ตั้งใจไม่บอก
 * (บอกไปคือยืนยันให้คนเดารหัสว่าชื่อผู้ใช้นี้มีอยู่จริง)
 */
function loginErrorText(status, data) {
  const detail = Array.isArray(data.detail)
    ? data.detail.map((d) => `${(d.loc || []).slice(-1)}: ${d.msg}`).join(", ")
    : data.detail;
  if (status === 401) {
    return {
      text: "ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง",
      detail: "ตรวจตัวพิมพ์เล็ก/ใหญ่และภาษาของแป้นพิมพ์ แล้วลองอีกครั้ง",
    };
  }
  if (status === 403) {
    return {
      text: "ยังไม่มีบัญชีผู้ดูแลในระบบ",
      detail: "ให้ผู้ดูแลสร้างบัญชีที่เครื่องเซิร์ฟเวอร์ด้วยคำสั่ง " +
        "python scripts/admin_user.py --username <ชื่อ> แล้วเข้าสู่ระบบอีกครั้ง" +
        (detail ? " · เซิร์ฟเวอร์แจ้ง: " + detail : ""),
    };
  }
  if (status === 429) {
    return {
      text: "ผิดหลายครั้งจนถูกล็อกชั่วคราว",
      detail: detail || "รอสักครู่แล้วลองอีกครั้ง",
    };
  }
  if (status === 503) {
    return {
      text: "เซิร์ฟเวอร์ตั้งค่าไม่ครบ จึงเข้าสู่ระบบไม่ได้",
      detail: detail || "ดู log ของเซิร์ฟเวอร์ว่าตัวแปรตัวไหนยังไม่ได้ตั้ง",
    };
  }
  return { text: detail || `เข้าสู่ระบบไม่สำเร็จ (HTTP ${status})`, detail: "" };
}

async function submitLogin(event) {
  event.preventDefault();
  const button = el("gatesubmit");
  if (button.disabled) return;   // กดรัว ๆ ต้องไม่ยิงซ้ำ
  const username = el("gateuser").value.trim();
  const password = el("gatepass").value;
  gateError("");
  if (!username || !password) {
    gateError("กรอกทั้งชื่อผู้ใช้และรหัสผ่านก่อน");
    (username ? el("gatepass") : el("gateuser")).focus();
    return;
  }

  let data = null;
  setBusy(button, true);
  el("gatestatus").textContent = "กำลังเข้าสู่ระบบ…";
  try {
    const res = await fetch("/api/admin/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      // เซิร์ฟเวอร์ตอบมาพร้อม Set-Cookie — ต้องให้เบราว์เซอร์รับเก็บ
      credentials: "same-origin",
      body: JSON.stringify({ username, password }),
    });
    data = await res.json().catch(() => ({}));
    if (!res.ok) {
      const problem = loginErrorText(res.status, data);
      gateError(problem.text, problem.detail);
      el("gatepass").value = "";
      el("gatepass").focus();
      return;
    }
  } catch (error) {
    gateError("ติดต่อเซิร์ฟเวอร์ไม่ได้",
      "เซิร์ฟเวอร์ไม่ตอบหรือตอบมาไม่ใช่ JSON — ตรวจว่าเซิร์ฟเวอร์ยังรันอยู่ " +
      "และเน็ตยังต่ออยู่ แล้วลองอีกครั้ง");
    return;
  } finally {
    setBusy(button, false);
    el("gatestatus").textContent = "";
  }

  // ผ่านแล้ว — cookie เป็นของเซิร์ฟเวอร์ ที่นี่เก็บแค่ของที่เอาไปแสดงบนแถบหัว
  adminUser = data.username || username;
  sessionExpiresAt = typeof data.expires_in === "number" && data.expires_in > 0
    ? Date.now() + data.expires_in * 1000
    : null;
  expiryWarned = false;
  const firstTime = state === null;
  hideGate();
  clearNotices();
  if (firstTime) {
    await afterLogin();
    return;
  }
  // ล็อกอินซ้ำกลางทาง: ไม่โหลดข้อมูลใหม่ ไม่วาดหน้าใหม่ — ของที่พิมพ์ค้างต้องอยู่
  setWho(whoLine(), "on");
  // เซสชันกลับมาแล้ว ปลดล็อกการโหลดเองที่หยุดไว้ตอนเจอ 401
  autoBlocked = false;
  if (appWired) {
    autoStatus("รอโหลดรอบถัดไป");
    autoStart();
  }
  notice("เข้าสู่ระบบอีกครั้งแล้ว", "ok",
    "หน้านี้ไม่ถูกโหลดใหม่ ข้อความที่พิมพ์ค้างไว้ยังอยู่ — กดปุ่มที่ค้างไว้ซ้ำได้เลย");
}

/** เจอ 401 กลางทาง: เปิดกล่องล็อกอินซ้อนบนหน้าเดิม ไม่รีโหลด ไม่เด้งไปไหน */
function onSessionLost() {
  sessionExpiresAt = null;
  expiryWarned = false;
  setWho("เซสชันหมดอายุ", "off");
  // คำขอหลายใบได้ 401 พร้อมกันได้ — กล่องเดียวพอ
  if (el("gate").open) return;
  showGate({
    text: "เซสชันหมดอายุ — เข้าสู่ระบบอีกครั้งเพื่อทำต่อ",
    kind: "warn",
    detail: "หน้านี้ไม่ถูกโหลดใหม่ ข้อความที่พิมพ์ค้างไว้ยังอยู่ครบ",
  });
}

function wireGate() {
  el("gateform").addEventListener("submit", submitLogin);
  el("gateeye").addEventListener("click", () => {
    setPasswordVisible(el("gatepass").type === "password");
    el("gatepass").focus();
  });
  // กดปิดกล่องนี้ไม่ได้ (Esc ก็ไม่ได้) — ปิดไปก็ใช้งานอะไรไม่ได้อยู่ดี
  el("gate").addEventListener("cancel", (event) => event.preventDefault());
  setPasswordVisible(false);
}

/**
 * เตือนก่อนเซสชันหมด เพื่อไม่ให้คนพิมพ์คำตอบยาว ๆ เสียของฟรี
 * **เตือนเท่านั้น ห้ามพาไปล็อกอินเอง** — กล่องล็อกอินขึ้นตอนเจอ 401 จริงพอ
 */
function watchSession() {
  if (sessionWatch !== null) return;
  sessionWatch = window.setInterval(() => {
    const gateShown = el("gate").open;
    if (adminUser && !gateShown) setWho(whoLine(), "on");
    if (gateShown || expiryWarned || sessionExpiresAt === null) return;
    if (sessionExpiresAt - Date.now() > WARN_BEFORE_MS) return;
    expiryWarned = true;
    notice(
      `เซสชันจะหมดอายุใน ${sessionMinsLeft()} นาที`,
      "warn",
      "กดบันทึกสิ่งที่พิมพ์ไว้ก่อนได้เลย — หมดอายุแล้วจะมีกล่องให้เข้าสู่ระบบ " +
        "อีกครั้งบนหน้านี้ หน้าไม่ถูกโหลดใหม่และข้อความที่พิมพ์ค้างไว้ไม่หาย"
    );
  }, 60 * 1000);
}

// ── เรียก API ───────────────────────────────────────────────────────────────
//
// ทุก endpoint ที่ต้องมีสิทธิ์เป็น POST รวมทั้งตัวที่แค่อ่าน และยืนยันตัวตนด้วย
// cookie ``admin_session`` (HttpOnly) ที่เบราว์เซอร์แนบไปให้เอง — เขียน
// ``credentials: "same-origin"`` ไว้ชัด ๆ ให้อ่านโค้ดแล้วรู้ว่าอะไรทำให้ผ่านสิทธิ์
//
// 401 = เซสชันหาย/หมดอายุ → เปิดกล่องล็อกอินซ้อนบนหน้าเดิม (ห้ามรีโหลดหน้า
// ห้ามเด้งไปไหน — ทำแล้ววนไม่จบและร่างที่พิมพ์ค้างหาย)
// 403 = ไม่มีสิทธิ์ · 503 = เซิร์ฟเวอร์ตั้งค่าไม่ครบ สองตัวนี้ล็อกอินใหม่กี่ครั้ง
// ก็ได้ผลเดิม จึงแค่แสดงข้อความ ไม่พาไปล็อกอิน

async function api(path, body) {
  const res = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    credentials: "same-origin",
    body: JSON.stringify(body || {}),
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) {
    onSessionLost();
    throw new Error(EXPIRED_TEXT);
  }
  if (!res.ok) {
    // detail ของ pydantic เป็น array ตอน validation ไม่ผ่าน (ไม่ใช่สตริง)
    // — ต้องแปลงเป็นบรรทัดที่คนอ่านรู้ว่าช่องไหนผิด ไม่ใช่โยน [object Object]
    const detail = Array.isArray(data.detail)
      ? data.detail.map((d) => `${(d.loc || []).slice(-1)}: ${d.msg}`).join(", ")
      : data.detail;
    throw new Error(detail || `ผิดพลาด (HTTP ${res.status})`);
  }
  return data;
}

// ── ตัวช่วยแสดงค่า ──────────────────────────────────────────────────────────

function text(value) {
  if (value === null || value === undefined || value === "") return "—";
  if (value === true) return "ใช่";
  if (value === false) return "ไม่";
  if (Array.isArray(value)) return value.length ? value.join(", ") : "—";
  return String(value);
}

function shortTime(value) {
  if (!value) return "—";
  // แสดงเวลาไทยเสมอ ไม่ตามเครื่องผู้ใช้ — คนอ่าน log นี้อยู่ที่คณะ
  return new Date(value).toLocaleString("th-TH", { timeZone: "Asia/Bangkok" });
}

/** แปลง changes ของ API เป็นบรรทัด "ช่อง: ค่าเดิม → ค่าใหม่" */
function changeLines(changes) {
  return Object.entries(changes || {})
    .map(([field, change]) => `${field}: ${text(change.from)} → ${text(change.to)}`)
    .join("\n");
}
