  { id: "audit", label: "ประวัติการแก้" },
];

function tabById(id) {
  return TABS.find((tab) => tab.id === id);
}

/** ตัวเลขบนป้ายของแท็บ — ให้เห็นจากแถบแท็บว่าตารางไหนว่างอยู่ */
function tabCount(tab) {
  if (!state) return null;
  const counts = state.counts || {};
  if (tab.id === "chat_logs") return counts.unanswered ?? null;
  if (tab.id === "audit") return (state.audit || []).length;
  if (!tab.rows) return null;
  return (tab.rows() || []).length;
}

// ── ฟอร์ม ───────────────────────────────────────────────────────────────────
//
// สร้างจาก ``fields`` ของแท็บ ไม่ได้เขียน HTML ของแต่ละฟอร์มแยก — ฟอร์มที่
// copy-paste กันมักจะลืมแก้ที่ใดที่หนึ่งเวลาเพิ่มช่อง แล้วค่านั้นจะหายเงียบ ๆ

function inputFor(field) {
  let node;
  if (field.type === "textarea") {
    node = document.createElement("textarea");
  } else if (field.type === "select") {
    node = document.createElement("select");
    for (const [value, label] of field.options) {
      const option = document.createElement("option");
      option.value = value;
      option.textContent = label;
      node.appendChild(option);
    }
  } else {
    node = document.createElement("input");
    node.type = field.type === "number" ? "number" : field.type === "checkbox" ? "checkbox" : "text";
    if (field.type === "number") {
      node.inputMode = "numeric";
      if (field.numMin !== undefined) node.min = String(field.numMin);
      if (field.numMax !== undefined) node.max = String(field.numMax);
    }
    // รหัสวิชาเป็นตัวเลขล้วน — เปิดแป้นตัวเลขบนมือถือให้พิมพ์เร็วและผิดยาก
    if (field.numeric) node.inputMode = "numeric";
  }
  // ปล่อยให้เบราว์เซอร์กันความยาวให้ด้วย (นอกจากตัวนับ) — แต่ยังตรวจใน JS อยู่
  // เพราะ maxLength ไม่กันการวางทับด้วยสคริปต์และไม่กันช่อง textarea ทุกรุ่น
  if (field.max && field.type !== "checkbox" && field.type !== "select" && field.type !== "number") {
    node.maxLength = field.max;
  }
  node.id = `f_${field.name}`;
  node.name = field.name;
  if (field.readonly) node.readOnly = true;
  return node;
}

/** ตัวนับตัวอักษรสด ๆ — ช่อง ``answer`` คือช่องที่เกินแล้วบอทส่งไม่ผ่าน LINE */
function attachCounter(node, field, counter) {
  const paint = () => {
    const used = node.value.length;
    counter.textContent = `${used.toLocaleString("th-TH")} / ${field.max.toLocaleString("th-TH")}`;
    counter.className =
      "count" + (used > field.max ? " count--over" : used >= field.max * 0.9 ? " count--near" : "");
  };
  node.addEventListener("input", paint);
  paint();
}

function fieldBox(field) {
  const box = document.createElement("div");
  box.className = "field" + (field.wide || field.type === "textarea" ? " wide" : "");
  const node = inputFor(field);

  if (field.type === "checkbox") {
    // ช่องติ๊กเอา label ครอบทั้งแถวเพื่อให้พื้นที่แตะกว้างกว่ากล่องเล็ก ๆ
    const label = document.createElement("label");
    label.className = "check";
    label.htmlFor = node.id;
    label.append(node, document.createTextNode(field.label));
    box.appendChild(label);
    if (field.hint) box.appendChild(hintNode(field));
    return box;
  }

  const label = document.createElement("label");
  label.htmlFor = node.id;
  label.textContent = field.label;
  if (field.required) {
    const star = document.createElement("span");
    star.className = "req";
    star.textContent = "*";
    star.title = "ต้องกรอก";
    label.appendChild(star);
  }
  box.append(label, node);

  const line = document.createElement("div");
  line.className = "rowline";
  const describedBy = [];
  if (field.hint || field.patternHint) {
    const hint = hintNode(field);
    hint.id = `h_${field.name}`;
    describedBy.push(hint.id);
    line.appendChild(hint);
  } else {
    line.appendChild(document.createElement("span"));
  }
  if (field.max && (field.type === "textarea" || !field.type)) {
    const counter = document.createElement("span");
    counter.className = "count";
    counter.setAttribute("aria-hidden", "true");
    line.appendChild(counter);
    attachCounter(node, field, counter);
  }
  box.appendChild(line);

  const error = document.createElement("div");
  error.className = "fielderr";
  error.id = `e_${field.name}`;
  error.hidden = true;
  describedBy.push(error.id);
  box.appendChild(error);
  node.setAttribute("aria-describedby", describedBy.join(" "));
  return box;
}

function hintNode(field) {
  const hint = document.createElement("div");
  hint.className = "hint";
  hint.textContent = [field.hint, field.patternHint].filter(Boolean).join(" · ");
  return hint;
}

function showFieldError(field, message) {
  const node = el(`f_${field.name}`);
  const box = el(`e_${field.name}`);
  if (box) {
    box.textContent = message || "";
    box.hidden = !message;
  }
  if (node) {
    if (message) node.setAttribute("aria-invalid", "true");
    else node.removeAttribute("aria-invalid");
  }
}

function clearFieldErrors(tab) {
  for (const field of tab.fields) showFieldError(field, null);
}

/**
 * ตรวจค่าหนึ่งช่องตามขอบเขตที่ลอกมาจาก pydantic — คืนข้อความผิด หรือ null
 *
 * ตรวจที่นี่เพื่อบอกคนกรอกก่อนยิง **ไม่ใช่แทน** การตรวจฝั่งเซิร์ฟเวอร์:
 * ข้อความผิดจากเซิร์ฟเวอร์ยังถูกแสดงเสมอ (ดู submitForm) เพราะกฎบางข้อ
 * อยู่ที่ DB เท่านั้น เช่น ชื่ออาจารย์ที่ไม่มีอยู่จริง
 */
function fieldError(field, value) {
  if (field.type === "checkbox" || field.type === "select") return null;
  const empty = value === null || value === undefined || value === "";
  if (field.required && empty) return "ต้องกรอกช่องนี้";
  if (empty) return null;
  if (field.type === "number") {
    if (!Number.isInteger(value)) return "ต้องเป็นจำนวนเต็ม";
    if (field.numMin !== undefined && value < field.numMin) return `ต้องไม่น้อยกว่า ${field.numMin}`;
    if (field.numMax !== undefined && value > field.numMax) return `ต้องไม่เกิน ${field.numMax}`;
    return null;
  }
  if (field.type === "list") {
    if (field.maxItems && value.length > field.maxItems) {
      return `ใส่ได้ไม่เกิน ${field.maxItems} คำ (ตอนนี้ ${value.length})`;
    }
    return null;
  }
  const length = String(value).length;
  if (field.min && length < field.min) return `ต้องยาวอย่างน้อย ${field.min} ตัวอักษร`;
  if (field.max && length > field.max) {
    return `ยาวเกิน ${field.max.toLocaleString("th-TH")} ตัวอักษร (ตอนนี้ ${length.toLocaleString("th-TH")})`;
  }
  if (field.pattern && !new RegExp(field.pattern).test(String(value))) {
    return field.patternHint || "รูปแบบไม่ถูกต้อง";
  }
  return null;
}

function collectForm(tab) {
  const body = {};
  const problems = [];
  for (const field of tab.fields) {
    const node = el(`f_${field.name}`);
    if (!node) continue;
    if (field.type === "checkbox") {
      body[field.name] = node.checked;
      continue;
    }
    const raw = node.value.trim();
    if (field.type === "list") {
      body[field.name] = raw ? raw.split(",").map((s) => s.trim()).filter(Boolean) : [];
    } else if (field.type === "number") {
      body[field.name] = raw === "" ? null : Number(raw);
    } else {
      // ช่องว่าง → null ไม่ใช่ "" เพราะคอลัมน์พวกนี้ใช้ NULL แทน "ไม่มีข้อมูล"
      // และ query ฝั่งบอทเช็ค IS NOT NULL (สตริงว่างจะนับว่า "มีเบอร์แล้ว")
      body[field.name] = raw === "" ? null : raw;
    }
    const message = fieldError(field, body[field.name]);
    if (message) problems.push({ field, message });
  }
  return { body, problems };
}

function fillForm(tab, row) {
  for (const field of tab.fields) {
    const node = el(`f_${field.name}`);
    if (!node) continue;
    const value = row ? row[field.name] : undefined;
    if (field.type === "checkbox") {
      node.checked = Boolean(value);
    } else if (field.type === "list") {
      node.value = Array.isArray(value) ? value.join(", ") : value || "";
    } else if (value === null || value === undefined) {
      // ค่าดีฟอลต์ตอนเพิ่มใหม่: รหัสหลักสูตรที่กำลังดูอยู่ (พิมพ์ซ้ำทุกแถวคือ
      // จุดที่คนพิมพ์ผิดแล้วได้แถวที่ planner มองไม่เห็น)
      node.value = !row && field.name === "program_code" ? state.program_code : "";
    } else {
      node.value = String(value);
    }
    node.dispatchEvent(new Event("input"));
  }
  clearFieldErrors(tab);
}

/** เอาแถวจากตารางมาเติมในฟอร์ม แล้วเลื่อนขึ้นไปให้เห็นว่ากำลังแก้อะไร */
function editRow(tab, row) {
  editingKey = tab.key.map((name) => String(row[name])).join(" | ");
  render();
  fillForm(tab, row);
  const first = tab.fields.find((f) => !f.readonly && f.type !== "checkbox");
  const target = first ? el(`f_${first.name}`) : null;
  window.scrollTo({ top: 0, behavior: "smooth" });
  if (target) target.focus({ preventScroll: true });
}

function renderForm(tab) {
  const card = document.createElement("section");
  card.className = "card";

  const head = document.createElement("div");
  head.className = "card__head";
  const title = document.createElement("h2");
  title.textContent = editingKey
    ? `กำลังแก้: ${editingKey}`
    : tab.editOnly ? `แก้ ${tab.label}` : `เพิ่มหรือแก้ ${tab.label}`;
  head.appendChild(title);
  if (tab.lead) {
    const sub = document.createElement("div");
    sub.className = "sub";
    sub.textContent = tab.lead;
    head.appendChild(sub);
  }
  card.appendChild(head);

  const body = document.createElement("div");
  body.className = "card__body";
  if (tab.editOnly && !editingKey) body.appendChild(inlineMsg(tab.editOnly, "warn"));
  if (tab.note) body.appendChild(inlineMsg(tab.note, "warn"));

  // เป็น <form> จริงเพื่อให้กด Enter ในช่องข้อความเท่ากับกดบันทึก และเพื่อให้
  // ช่องทั้งหมดถูกจัดกลุ่มให้เครื่องช่วยอ่านรู้ว่านี่คือฟอร์มเดียวกัน
  const form = document.createElement("form");
  form.noValidate = true;
  form.autocomplete = "off";
  const grid = document.createElement("div");
  grid.className = "grid";
  for (const field of tab.fields) grid.appendChild(fieldBox(field));
  form.appendChild(grid);

  const actions = document.createElement("div");
  actions.className = "actions";
  const save = document.createElement("button");
  save.type = "submit";
  save.className = "btn btn--primary";
  save.append(icon("save"), document.createTextNode("บันทึก"));
  const reset = document.createElement("button");
  reset.type = "button";
  reset.className = "btn btn--ghost";
  reset.textContent = editingKey ? "เลิกแก้แถวนี้" : "ล้างฟอร์ม";
  reset.addEventListener("click", () => {
    editingKey = null;
    render();
  });
  const status = document.createElement("span");
  status.className = "status";
  status.id = "formstatus";
  actions.append(save, reset, status);
  form.appendChild(actions);

  if (tab.editOnly && !editingKey) {
    save.disabled = true;
    status.textContent = "เลือกแถวที่จะแก้จากรายการข้างล่างก่อน";
  }

  form.addEventListener("submit", (event) => {
    event.preventDefault();
    submitForm(tab, save, status);
  });
  body.appendChild(form);
  card.appendChild(body);
  return card;
}

/** ทำให้ปุ่มกันกดซ้ำระหว่างรอเซิร์ฟเวอร์ และเห็นได้ว่ากำลังทำงานอยู่ */
function setBusy(button, busy) {
  button.disabled = busy;
  const already = button.querySelector(".spin");
  if (busy && !already) button.insertBefore(spinner(), button.firstChild);
  if (!busy && already) already.remove();
}

function spinner() {
  const dot = document.createElement("span");
  dot.className = "spin";
  return dot;
}

async function submitForm(tab, button, status) {
  clearNotices();
  clearFieldErrors(tab);
  const { body, problems } = collectForm(tab);
  if (problems.length) {
    for (const problem of problems) showFieldError(problem.field, problem.message);
    notice(
      `ยังบันทึกไม่ได้ — มี ${problems.length} ช่องที่ต้องแก้`,
      "err",
      problems.map((p) => `${p.field.label}: ${p.message}`).join("\n")
    );
    const first = el(`f_${problems[0].field.name}`);
    if (first) first.focus();
    return;
  }

  setBusy(button, true);
  status.textContent = "กำลังบันทึก…";
  try {
    const result = await api(tab.endpoint, body);
    const changed = Object.keys(result.changes || {});
    // "บันทึกแล้วไม่มีอะไรเปลี่ยน" เป็นข้อมูลที่มีประโยชน์ ไม่ใช่ความล้มเหลว
    // — คนกดจะรู้ว่าค่าที่พิมพ์ไปตรงกับของเดิมอยู่แล้ว ไม่ต้องเดา
    notice(
      result.action === "create"
        ? `เพิ่มแถวใหม่ใน ${tab.label} แล้ว`
        : changed.length
          ? `บันทึกแล้ว — เปลี่ยน ${changed.length} ช่อง`
          : "บันทึกแล้ว — ไม่มีค่าไหนต่างจากเดิม",
      "ok",
      changeLines(result.changes)
    );
    editingKey = null;
    await reload();
  } catch (error) {
    // ข้อความจากเซิร์ฟเวอร์ต้องขึ้นเสมอ ไม่ว่าฝั่งหน้าเว็บจะตรวจผ่านแล้วก็ตาม
    status.textContent = "";
    notice("บันทึกไม่สำเร็จ", "err", error.message);
    setBusy(button, false);
  }
}

// ── ตารางรายการ ─────────────────────────────────────────────────────────────

function emptyState(config) {
  const box = document.createElement("div");
  box.className = "empty";
  const art = document.createElement("div");
  art.className = "icon";
  art.appendChild(icon("empty"));
  box.appendChild(art);
  const title = document.createElement("h3");
  title.textContent = config.title;
  const body = document.createElement("p");
  body.textContent = config.body;
  box.append(title, body);
  if (config.steps) {
    const list = document.createElement("ol");
    list.className = "steps";
    for (const step of config.steps) {
      const item = document.createElement("li");
      item.textContent = step;
      list.appendChild(item);
    }
    box.appendChild(list);
  }
  return box;
}

/** ใส่ป้ายชื่อคอลัมน์ในเซลล์ด้วย เพื่อให้จอแคบอ่านการ์ดรู้เรื่อง (ดู CSS) */
function cell(label, cls) {
  const td = document.createElement("td");
  if (cls) td.className = cls;
  if (label) {
    const tag = document.createElement("span");
    tag.className = "rowlabel";
    tag.setAttribute("aria-hidden", "true");
    tag.textContent = label;
    td.appendChild(tag);
  }
  return td;
}

// ── สถานะการยุบ/กาง/ค้นหาของแต่ละแท็บ ──────────────────────────────────────
//
// อยู่ในหน่วยความจำเท่านั้น และอยู่ **นอก** ฟังก์ชัน render() เพราะกดปิดใช้
// แถวเดียวแล้วหน้าถูกวาดใหม่ทั้งหน้า — ถ้าเก็บสถานะไว้ในตัว DOM ทุกกลุ่มจะ
// ยุบกลับหมดทุกครั้งที่บันทึก (ไม่จำข้ามการโหลดหน้าใหม่โดยเจตนา)

const ui = {};

function uiFor(id) {
  if (!ui[id]) {
    ui[id] = {
      query: "", status: "all",
      closed: new Set(),   // ชื่อกลุ่มที่ยุบอยู่
      open: new Set(),     // กุญแจแถวที่กางอยู่ (มีผลบนจอแคบ)
      full: new Set(),     // ช่องข้อความยาวที่กางเต็มแล้ว
      groupInit: false, rowInit: false,
    };
  }
  return ui[id];
}

function rowKeyText(tab, row) {
  return (tab.key || []).map((name) => String(row[name])).join(" | ");
}

/** ข้อความทั้งแถวไว้ให้ค้นหา — รวมช่องที่ไม่ได้แสดงเป็นคอลัมน์ (คำค้น/หมายเหตุ) */
function rowHaystack(row) {
  return Object.values(row)
    .map((value) => (Array.isArray(value) ? value.join(" ")
      : value === null || value === undefined ? "" : String(value)))
    .join(" ")
    .toLowerCase();
}

/** ตัดแถวตามคำค้น + สถานะ (ทำในหน้า ไม่ยิง API ใหม่) */
function filterRows(rows, state_) {
  const terms = state_.query.trim().toLowerCase().split(/\s+/).filter(Boolean);
  return rows.filter((row) => {
    if (state_.status === "on" && row.is_active === false) return false;
    if (state_.status === "off" && row.is_active !== false) return false;
    if (!terms.length) return true;
    const hay = rowHaystack(row);
    return terms.every((term) => hay.indexOf(term) >= 0);
  });
}

/** ช่องข้อความยาว: ตัดเหลือ 3 บรรทัดแล้วมีปุ่มกางเต็ม (จำสถานะไว้) */
function longCell(td, value, cellKey, state_) {
  const str = text(value);
  if (str.length <= 160) {
    td.appendChild(document.createTextNode(str));
    return;
  }
  const opened = state_.full.has(cellKey);
  const box = document.createElement("div");
  box.className = "clamp" + (opened ? " clamp--open" : "");
  box.textContent = str;
  const more = document.createElement("button");
  more.type = "button";
  more.className = "linkbtn";
  const label = (on) => (on ? "ย่อข้อความ" : `ดูข้อความเต็ม (${str.length} ตัวอักษร)`);
  more.textContent = label(opened);
  more.setAttribute("aria-expanded", opened ? "true" : "false");
  more.addEventListener("click", () => {
    const now = !state_.full.has(cellKey);
    if (now) state_.full.add(cellKey); else state_.full.delete(cellKey);
    box.classList.toggle("clamp--open", now);
    more.textContent = label(now);
    more.setAttribute("aria-expanded", now ? "true" : "false");
  });
  td.append(box, more);
}

// ── ตารางรายการ + ตัวกรอง + กลุ่มที่ยุบได้ ─────────────────────────────────

function renderTable(tab) {
  const all = tab.rows() || [];
  const box = uiFor(tab.id);
  const card = document.createElement("section");
  card.className = "card card--flush";

  const head = document.createElement("div");
  head.className = "card__head";
  const title = document.createElement("h2");
  title.textContent = `รายการ ${tab.label}`;
  const sub = document.createElement("div");
  sub.className = "sub";
  const off = all.filter((row) => row.is_active === false).length;
  sub.textContent = all.length
    ? `${all.length} แถว` + (off ? ` · ปิดใช้อยู่ ${off} แถว` : " · ใช้งานอยู่ทั้งหมด")
    : "ยังไม่มีข้อมูล";
  head.append(title, sub);
  card.appendChild(head);

  if (!all.length) {
    const body = document.createElement("div");
    body.className = "card__body";
    body.appendChild(
      emptyState(
        tab.empty || {
          title: "ยังไม่มีข้อมูลในตารางนี้",
          body: "กรอกฟอร์มด้านบนเพื่อเพิ่มแถวแรก",
        }
      )
    );
    card.appendChild(body);
    return card;
  }

  // ครั้งแรกของแท็บนี้: ของเยอะ = เริ่มแบบยุบไว้ (เห็นภาพรวมก่อนว่ามีอะไรกี่อัน)
  const grouped = typeof tab.groupBy === "function";
  const groupNames = grouped
    ? Array.from(new Set(all.map((row) => tab.groupBy(row)))).sort((a, b) => a.localeCompare(b, "th"))
    : [];
  if (grouped && !box.groupInit) {
    box.groupInit = true;
    if (all.length > 12 && groupNames.length > 1) {
      for (const name of groupNames) box.closed.add(name);
    }
  }
  if (!box.rowInit) {
    box.rowInit = true;
    if (all.length <= 6) {
      for (const row of all) box.open.add(rowKeyText(tab, row));
    }
  }

  const hits = document.createElement("div");
  hits.className = "hitcount";
  const holder = document.createElement("div");

  /** วาดเฉพาะรายการ ไม่แตะช่องค้นหา — โฟกัส/เคอร์เซอร์ในช่องจึงไม่กระเด็น */
  const paint = () => {
    const rows = filterRows(all, box);
    hits.textContent = "";
    const line = document.createElement("span");
    line.append(
      document.createTextNode("แสดง "),
      Object.assign(document.createElement("b"), { textContent: String(rows.length) }),
      document.createTextNode(` จาก ${all.length} แถว`)
    );
    hits.appendChild(line);
    holder.textContent = "";
    if (!rows.length) {
      const pad = document.createElement("div");
      pad.className = "card__body";
      pad.appendChild(emptyState({
        title: "ไม่พบแถวที่ตรงกับที่กรองไว้",
        body: `มีทั้งหมด ${all.length} แถว แต่ไม่มีแถวไหนตรงกับคำค้น/สถานะที่เลือก ` +
          "— ลองใช้คำสั้นลง หรือกดล้างตัวกรอง",
      }));
      holder.appendChild(pad);
      return;
    }
    holder.appendChild(buildTable(tab, rows, box, grouped, groupNames));
  };

  card.appendChild(filterBar(tab, box, all, groupNames, paint));
  card.append(hits, holder);
  paint();

  const foot = document.createElement("div");
  foot.className = "card__body";
  foot.appendChild(legend());
  card.appendChild(foot);
  return card;
}

/**
 * ช่องค้นหาหนึ่งช่อง: input ตัวเดิม (type=search) + ไอคอนแว่นขยาย + ปุ่มล้างคำค้น
 *
 * ไม่แตะพฤติกรรมการกรอง — ยังเป็น listener ``input`` ที่เรียก ``onChange``
 * ทุกตัวอักษรเหมือนเดิม ผู้เรียกยังได้ ``input`` ตัวจริงไปใช้ต่อ
 * (บางที่ต้องเซ็ต ``value = ""`` เอง ตอนกด "ล้างตัวกรอง" — ให้เรียก ``sync``
 *  ต่อท้ายด้วย ไม่งั้นปุ่มกากบาทค้างอยู่ทั้งที่ช่องว่างแล้ว)
 */
function searchField(id, value, placeholder, onChange) {
  const wrap = document.createElement("div");
  wrap.className = "searchfield";
  const input = document.createElement("input");
  input.type = "search";
  input.id = id;
  input.value = value;
  input.placeholder = placeholder;
  input.autocomplete = "off";
  const glass = icon("search");
  glass.classList.add("searchicon");
  const clear = document.createElement("button");
  clear.type = "button";
  clear.className = "searchclear";
  clear.setAttribute("aria-label", "ล้างคำค้น");
  clear.appendChild(icon("close"));
  const sync = () => { clear.hidden = input.value === ""; };
  sync();
  input.addEventListener("input", () => { sync(); onChange(); });
  clear.addEventListener("click", () => {
    input.value = "";
    sync();
    onChange();
    input.focus();   // กดล้างแล้วพิมพ์ต่อได้เลย ไม่ต้องกลับไปคลิกช่องเอง
  });
  // ลำดับใน DOM: input มาก่อน เพื่อให้กฎ ``input:focus ~ .searchicon`` ติด
  // (ไอคอนเป็น aria-hidden ทั้งคู่ ลำดับจึงไม่มีผลกับ screen reader)
  wrap.append(input, glass, clear);
  return { wrap, input, sync };
}

/** แถบค้นหา/กรอง/ยุบทั้งหมด — ทุกอย่างทำในหน้า ไม่ยิง API ใหม่ */
function filterBar(tab, box, all, groupNames, paint) {
  const bar = document.createElement("div");
  bar.className = "filterbar";

  const searchWrap = document.createElement("div");
  searchWrap.className = "grow";
  const searchLabel = document.createElement("label");
  searchLabel.htmlFor = `find_${tab.id}`;
  searchLabel.textContent = `ค้นหาใน ${all.length} แถวนี้`;
  const search = searchField(`find_${tab.id}`, box.query,
    "พิมพ์คำที่อยู่ในแถว เช่น ชื่อ รหัส หมวด", () => {
      box.query = search.input.value;
      paint();
    });
  searchWrap.append(searchLabel, search.wrap);

  const statusWrap = document.createElement("div");
  const statusLabel = document.createElement("label");
  statusLabel.htmlFor = `stat_${tab.id}`;
  statusLabel.textContent = "สถานะ";
  const status = document.createElement("select");
  status.id = `stat_${tab.id}`;
  for (const [value, label] of [["all", "ทั้งหมด"], ["on", "ใช้งาน"], ["off", "ปิดใช้"]]) {
    const option = document.createElement("option");
    option.value = value;
    option.textContent = label;
    if (box.status === value) option.selected = true;
    status.appendChild(option);
  }
  status.addEventListener("change", () => {
    box.status = status.value;
    paint();
  });
  statusWrap.append(statusLabel, status);
  bar.append(searchWrap, statusWrap);

  const spread = document.createElement("div");
  spread.className = "spread";
  const openAll = document.createElement("button");
  openAll.type = "button";
  openAll.className = "btn btn--ghost btn--sm";
  openAll.textContent = "กางทั้งหมด";
  openAll.addEventListener("click", () => {
    box.closed.clear();
    for (const row of all) box.open.add(rowKeyText(tab, row));
    paint();
  });
  const shutAll = document.createElement("button");
  shutAll.type = "button";
  shutAll.className = "btn btn--ghost btn--sm";
  shutAll.textContent = "ยุบทั้งหมด";
  shutAll.addEventListener("click", () => {
    for (const name of groupNames) box.closed.add(name);
    box.open.clear();
    paint();
  });
  const clear = document.createElement("button");
  clear.type = "button";
  clear.className = "btn btn--ghost btn--sm";
  clear.textContent = "ล้างตัวกรอง";
  clear.addEventListener("click", () => {
    box.query = "";
    box.status = "all";
    search.input.value = "";
    search.sync();
    status.value = "all";
    paint();
  });
  spread.append(openAll, shutAll, clear);
  bar.appendChild(spread);
  return bar;
}

/** ตารางจริง: <tbody> หนึ่งก้อนต่อหนึ่งกลุ่ม หัวกลุ่มเป็นปุ่มยุบ/กาง */
function buildTable(tab, rows, box, grouped, groupNames) {
  const wrap = document.createElement("div");
  wrap.className = "tablewrap";
  const table = document.createElement("table");
  table.className = "rows";
  const caption = document.createElement("caption");
  caption.className = "sr-only";
  caption.textContent = `รายการ ${tab.label} ${rows.length} แถว`;
  table.appendChild(caption);

  const headers = tab.columns.map((column) => column.label)
    .concat(["สถานะ", "แก้ไขล่าสุด", "การจัดการ"]);
  const thead = document.createElement("thead");
  const hrow = document.createElement("tr");
  for (const label of headers) {
    const th = document.createElement("th");
    th.scope = "col";
    th.textContent = label;
    hrow.appendChild(th);
  }
  thead.appendChild(hrow);
  table.appendChild(thead);

  if (!grouped) {
    const tbody = document.createElement("tbody");
    for (const row of rows) tbody.appendChild(renderRow(tab, row, box));
    table.appendChild(tbody);
    wrap.appendChild(table);
    return wrap;
  }

  // ค้นหาอยู่ = ถือว่ากางทุกกลุ่ม ไม่งั้นค้นแล้วจะไม่เห็นอะไรเลย
  const searching = box.query.trim() !== "";
  for (const name of groupNames) {
    const mine = rows.filter((row) => tab.groupBy(row) === name);
    if (!mine.length) continue;
    const tbody = document.createElement("tbody");
    const shown = searching || !box.closed.has(name);

    const grouptr = document.createElement("tr");
    grouptr.className = "grouprow";
    const cellHead = document.createElement("td");
    cellHead.colSpan = headers.length;
    const button = document.createElement("button");
    button.type = "button";
    button.className = "grouphead";
    button.setAttribute("aria-expanded", shown ? "true" : "false");
    const caret = icon("caret");
    caret.classList.add("caret");
    const label = document.createElement("span");
    label.className = "grow";
    label.textContent = `${tab.groupLabel || "กลุ่ม"}: ${name}`;
    const count = document.createElement("span");
    count.className = "count";
    const dim = mine.filter((row) => row.is_active === false).length;
    count.textContent = `${mine.length} รายการ` + (dim ? ` · ปิดใช้ ${dim}` : "");
    button.append(caret, label, count);
    button.addEventListener("click", () => {
      if (box.closed.has(name)) box.closed.delete(name); else box.closed.add(name);
      paintGroup(tbody, button, tab, mine, box, name);
    });
    cellHead.appendChild(button);
    grouptr.appendChild(cellHead);
    tbody.appendChild(grouptr);

    if (shown) {
      for (const row of mine) tbody.appendChild(renderRow(tab, row, box));
    }
    table.appendChild(tbody);
  }
  wrap.appendChild(table);
  return wrap;
}

/** วาดใหม่เฉพาะกลุ่มที่ถูกกด — ไม่ยุ่งกับกลุ่มอื่นและไม่รีเซ็ตช่องค้นหา */
function paintGroup(tbody, button, tab, mine, box, name) {
  const shown = !box.closed.has(name);
  button.setAttribute("aria-expanded", shown ? "true" : "false");
  while (tbody.children.length > 1) tbody.removeChild(tbody.lastChild);
  if (shown) {
    for (const row of mine) tbody.appendChild(renderRow(tab, row, box));
  }
}

function legend() {
  const box = document.createElement("div");
  box.className = "legend";
  box.style.marginTop = "0";
  for (const line of [
    "“ปิดใช้” = บอทเลิกเอาแถวนั้นไปตอบ แต่ข้อมูลยังอยู่ เปิดกลับได้ทุกเมื่อ",
    "หน้านี้ไม่มีปุ่มลบโดยเจตนา — ลบแล้วรอบเก็บข้อมูลถัดไปจะเอากลับมาเงียบ ๆ",
    "บนจอมือถือแถวจะเริ่มแบบยุบ กด “ดูรายละเอียด” เพื่อกางเฉพาะแถวที่สนใจ",
  ]) {
    const item = document.createElement("span");
    item.textContent = line;
    box.appendChild(item);
  }
  return box;
}

function renderRow(tab, row, box) {
  const tr = document.createElement("tr");
  const keyText = rowKeyText(tab, row);
  const isOff = row.is_active === false;
  // คอลัมน์ที่ถือว่าเป็น "หัวแถว" — ต้องเห็นตอนยุบ: กุญแจของแถวเสมอ
  const summary = new Set((tab.summary || [tab.columns[0].name]).concat(tab.key || []));
  const opened = box.open.has(keyText);
  tr.className = (isOff ? "off " : "") + "fold" + (opened ? "" : " closed");
  if (isOff) tr.classList.add("off");

  for (const column of tab.columns) {
    const detail = !summary.has(column.name);
    const td = cell(column.label, (column.cls || "") + (detail ? " detailcell" : ""));
    if (column.type === "link" && row[column.name]) {
      const link = document.createElement("a");
      link.href = row[column.name];
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = row[column.name];
      td.appendChild(link);
    } else {
      longCell(td, row[column.name], `${keyText}|${column.name}`, box);
    }
    tr.appendChild(td);
  }

  const stateCell = cell("สถานะ", "nowrap");
  const badge = document.createElement("span");
  badge.className = "badge " + (isOff ? "badge--off" : "badge--on");
  badge.textContent = isOff ? "ปิดใช้" : "ใช้งาน";
  stateCell.appendChild(badge);
  tr.appendChild(stateCell);

  const when = cell("แก้ไขล่าสุด", "nowrap tiny detailcell");
  when.appendChild(document.createTextNode(row.updated_at ? shortTime(row.updated_at) : "—"));
  tr.appendChild(when);

  const buttons = cell("", "rowact");
  // ปุ่มกางรายละเอียด — โผล่เฉพาะจอแคบ (CSS) เพราะจอกว้างเห็นทุกคอลัมน์อยู่แล้ว
  const more = document.createElement("button");
  more.type = "button";
  more.className = "rowmore";
  more.setAttribute("aria-expanded", opened ? "true" : "false");
  const caret = icon("caret");
  const moreLabel = document.createElement("span");
  moreLabel.textContent = opened ? "ย่อรายละเอียด" : "ดูรายละเอียด";
  more.append(caret, moreLabel);
  more.addEventListener("click", () => {
    const now = !box.open.has(keyText);
    if (now) box.open.add(keyText); else box.open.delete(keyText);
    tr.classList.toggle("closed", !now);
    more.setAttribute("aria-expanded", now ? "true" : "false");
    moreLabel.textContent = now ? "ย่อรายละเอียด" : "ดูรายละเอียด";
  });

  const set = document.createElement("div");
  set.className = "btnset";
  const edit = document.createElement("button");
  edit.type = "button";
  edit.className = "btn btn--ghost btn--sm";
  edit.append(icon("edit"), document.createTextNode("แก้"));
  edit.addEventListener("click", () => editRow(tab, row));
  const flip = document.createElement("button");
  flip.type = "button";
  flip.className = "btn btn--sm " + (isOff ? "btn--ghost" : "btn--danger");
  flip.textContent = isOff ? "เปิดใช้" : "ปิดใช้";
  flip.addEventListener("click", () => toggleRow(tab, row, flip));
  set.append(edit, flip);
  buttons.append(more, set);
  tr.appendChild(buttons);
  return tr;
}

// ── กล่องยืนยัน ─────────────────────────────────────────────────────────────

/**
 * ถามยืนยันด้วย <dialog> (โฟกัสวนในกล่อง ปิดด้วย Esc ได้) — ถ้าเบราว์เซอร์
 * ไม่รู้จัก showModal จะถอยไป window.confirm เพื่อให้ยังมีการถามอยู่เสมอ
 */
function confirmAction(options) {
  const box = el("confirmbox");
  const plain = `${options.title}\n\n${options.text}\n\n${options.keyline}`;
  if (!box || typeof box.showModal !== "function") {
    return Promise.resolve(window.confirm(plain));
  }
  el("confirmtitle").textContent = options.title;
  el("confirmtext").textContent = options.text;
  el("confirmkey").textContent = options.keyline;
  const yes = el("confirmyes");
  yes.textContent = options.yesLabel || "ยืนยัน";
  yes.className = "btn " + (options.danger === false ? "btn--primary" : "btn--danger");

  return new Promise((resolve) => {
    const done = (answer) => {
      yes.removeEventListener("click", onYes);
      el("confirmno").removeEventListener("click", onNo);
      box.removeEventListener("close", onClose);
      if (box.open) box.close();
      resolve(answer);
    };
    const onYes = () => done(true);
    const onNo = () => done(false);
    const onClose = () => done(false);
    yes.addEventListener("click", onYes);
    el("confirmno").addEventListener("click", onNo);
    box.addEventListener("close", onClose);
    box.showModal();
  });
}

// ── เปิด/ปิดแถว (ปุ่มที่แทนการลบทั้งหน้า) ───────────────────────────────────

async function toggleRow(tab, row, button) {
  // จำนวนและลำดับของกุญแจต้องตรงกับ ``admin_repo.TABLE_KEYS`` เป๊ะ ๆ
  // ส่งไม่ครบ = เซิร์ฟเวอร์ตอบ 400 โดยเจตนา (กุญแจไม่ครบ = UPDATE ที่ขาด
  // WHERE = ปิดทั้งตารางในคลิกเดียว) จึงเช็คซ้ำที่นี่ก่อนยิงด้วย
  const key = tab.key.map((name) => row[name]);
  if (key.some((value) => value === null || value === undefined || value === "")) {
    notice("ปิด/เปิดแถวนี้ไม่ได้", "err",
      `กุญแจของแถวไม่ครบ (ต้องมี ${tab.key.join(", ")}) — โหลดหน้าใหม่แล้วลองอีกครั้ง`);
    return;
  }
  const keyText = key.map(String).join(" | ");
  const turningOff = row.is_active !== false;

  if (turningOff) {
    const okay = await confirmAction({
      title: `ปิดใช้แถวนี้ใน ${tab.label}?`,
      text: "บอทจะไม่เอาข้อมูลแถวนี้ไปตอบนักศึกษาอีก ข้อมูลยังอยู่ในระบบ " +
        "และกดเปิดกลับได้ทุกเมื่อ — นี่ไม่ใช่การลบ",
      keyline: keyText,
      yesLabel: "ปิดใช้แถวนี้",
    });
    if (!okay) return;
  }

  clearNotices();
  setBusy(button, true);
  try {
    const result = await api("/api/admin/toggle", {
      table: tab.table,
      key: key.map(String),
      is_active: !turningOff,
    });
    notice(
      turningOff ? "ปิดใช้แถวนี้แล้ว — บอทจะไม่เอาไปตอบอีก" : "เปิดใช้แถวนี้แล้ว",
      "ok",
      `${keyText}\n${changeLines(result.changes)}`
    );
    await reload();
  } catch (error) {
    notice("เปลี่ยนสถานะไม่สำเร็จ", "err", error.message);
    setBusy(button, false);
  }
}

// ── แท็บภาพรวม ──────────────────────────────────────────────────────────────

function statCard(item) {
  const box = document.createElement("div");
  const zero = item.zeroIsProblem && !item.num;
  box.className = "stat" + (zero ? " stat--empty" : "");
  const value = document.createElement("b");
  value.textContent = item.den === undefined
    ? String(item.num ?? 0)
    : `${item.num ?? 0}/${item.den ?? 0}`;
  const label = document.createElement("span");
  label.textContent = item.label;
  box.append(value, label);
  if (item.den) {
    const meter = document.createElement("div");
    meter.className = "meter";
    const fill = document.createElement("i");
    fill.style.width = `${Math.min(100, Math.round(((item.num || 0) / item.den) * 100))}%`;
    meter.appendChild(fill);
    box.appendChild(meter);
  }
  return box;
}

/** ปุ่มลัดไปแท็บอื่น — ใช้ในรายการ "ควรทำต่อ" ของหน้าภาพรวม */
function jumpButton(tabId, label) {
  const button = document.createElement("button");
  button.type = "button";
  button.className = "btn btn--ghost btn--sm";
  button.textContent = label;
  button.addEventListener("click", () => {
    activeTab = tabId;
    editingKey = null;
    clearNotices();
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
  return button;
}

function renderSummary() {
  const counts = state.counts || {};
  const frag = document.createDocumentFragment();

  const card = document.createElement("section");
  card.className = "card";
  const head = document.createElement("div");
  head.className = "card__head";
  const title = document.createElement("h2");
  title.textContent = `ภาพรวมคลังข้อมูล · หลักสูตร ${state.program_code}`;
  const sub = document.createElement("div");
  sub.className = "sub";
  sub.textContent = "ตัวเลขที่เป็น 0 คือคำถามที่บอทตอบว่า “ไม่มีข้อมูล” อยู่ตอนนี้";
  head.append(title, sub);
  card.appendChild(head);

  const body = document.createElement("div");
  body.className = "card__body";
  const stats = document.createElement("div");
  stats.className = "stats";
  for (const item of [
    { label: "FAQ ที่ใช้งาน", num: counts.faqs_active, den: counts.faqs, zeroIsProblem: true },
    { label: "เอกสารที่ใช้งาน", num: counts.documents_active, den: counts.documents },
    { label: "อาจารย์ในระบบ", num: counts.instructors },
    { label: "อาจารย์ที่มีเบอร์โทร", num: counts.with_phone, den: counts.instructors, zeroIsProblem: true },
    { label: "อาจารย์ที่มีเลขห้อง", num: counts.with_room, den: counts.instructors, zeroIsProblem: true },
    { label: "วิชาในแผนการเรียน", num: counts.curriculum_rules },
    { label: "เงื่อนไขวิชาบังคับก่อน", num: counts.prerequisites, zeroIsProblem: true },
    { label: "คำถามที่บอทตอบไม่ได้", num: counts.unanswered },
  ]) {
    stats.appendChild(statCard(item));
  }
  body.appendChild(stats);
  card.appendChild(body);
  frag.appendChild(card);

      `มี ${counts.unanswered} ข้อความที่บอทตอบไม่ได้ — เอามาเขียนเป็น FAQ ได้`]);
  }

function searchBar(id, labelText, placeholder, box, paint) {
  const bar = document.createElement("div");
  bar.className = "filterbar";
  const wrap = document.createElement("div");
  wrap.className = "grow";
  const label = document.createElement("label");
  label.htmlFor = `find_${id}`;
  label.textContent = labelText;
  const input = searchField(`find_${id}`, box.query, placeholder, () => {
    box.query = input.input.value;
    paint();
  });
  wrap.append(label, input.wrap);
  const clear = document.createElement("button");
  clear.type = "button";
  clear.className = "btn btn--ghost btn--sm";
  clear.textContent = "ล้างคำค้น";
  clear.addEventListener("click", () => {
    box.query = "";
    input.input.value = "";
    input.sync();
    paint();
  });
  bar.append(wrap, clear);
  return bar;
}

function renderTabs() {
  const bar = el("tabs");
  bar.textContent = "";
  el("tabbar").hidden = false;
  const buttons = [];
  for (const tab of TABS) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "tab";
    button.id = `tab_${tab.id}`;
    button.setAttribute("role", "tab");
    button.setAttribute("aria-controls", "view");
    const selected = tab.id === activeTab;
    button.setAttribute("aria-selected", String(selected));
    // แท็บที่ไม่ได้เลือกออกจากลำดับ Tab ตามแบบ tablist มาตรฐาน — เลื่อนแท็บ
    // ด้วยปุ่มลูกศร แล้ว Tab หนึ่งครั้งเข้าเนื้อหาเลย ไม่ต้องกด 8 ครั้งผ่านแท็บ
    button.tabIndex = selected ? 0 : -1;
    const label = document.createElement("span");
    label.textContent = tab.label;
    button.appendChild(label);
    const count = tabCount(tab);
    if (count !== null && count !== undefined) {
      const pill = document.createElement("span");
      pill.className = "pill";
      pill.textContent = String(count);
      button.appendChild(pill);
    }
    button.addEventListener("click", () => {
      if (activeTab === tab.id) return;
      activeTab = tab.id;
      editingKey = null;
      clearNotices();
      render();
    });
    buttons.push(button);
    bar.appendChild(button);
  }

  bar.addEventListener("keydown", (event) => {
    const keys = { ArrowRight: 1, ArrowLeft: -1 };
    const index = TABS.findIndex((tab) => tab.id === activeTab);
    let next = null;
    if (event.key in keys) next = (index + keys[event.key] + TABS.length) % TABS.length;
    if (event.key === "Home") next = 0;
    if (event.key === "End") next = TABS.length - 1;
    if (next === null) return;
    event.preventDefault();
    activeTab = TABS[next].id;
    editingKey = null;
    clearNotices();
    render();
    const moved = el(`tab_${activeTab}`);
    if (moved) {
      moved.focus();
      moved.scrollIntoView({ block: "nearest", inline: "center" });
    }
  });

  const current = el(`tab_${activeTab}`);
  if (current) current.scrollIntoView({ block: "nearest", inline: "nearest" });
}

function render() {
  renderTabs();
  const view = el("view");
  view.textContent = "";
  view.setAttribute("role", "tabpanel");
  view.setAttribute("aria-labelledby", `tab_${activeTab}`);
  view.tabIndex = 0;
  const tab = tabById(activeTab);
  if (activeTab === "summary") {
    view.appendChild(renderSummary());
  } else if (activeTab === "chat_logs") {
    view.appendChild(renderChatLogs());
  } else if (activeTab === "audit") {
    view.appendChild(renderAudit());
  } else {
    view.appendChild(renderForm(tab));
    view.appendChild(renderTable(tab));
    if (!editingKey) fillForm(tab, null);
  }
}

// ── โหลดข้อมูลใหม่เองเป็นระยะ ───────────────────────────────────────────────
//
// เส้นทางเดียวกับปุ่ม "โหลดใหม่" เป๊ะ ๆ (``reload()`` → ``/api/admin/state``)
// ไม่มี fetch เส้นที่สอง ต่างกันแค่ "ไม่รบกวน": ไม่ล้างกล่องข้อความ ไม่เด้ง
// ข้อความ "โหลดข้อมูลใหม่แล้ว" ทุกนาที และคืนตำแหน่ง scroll ให้เท่าเดิม
//
// สิ่งที่ผู้ใช้ทำค้างไว้อยู่รอดอยู่แล้วโดยโครงของหน้า: คำค้น/กลุ่มที่ยุบ/แถวที่กาง
// เก็บใน ``ui`` ซึ่งอยู่นอก render() และแท็บที่เปิดอยู่ใน ``activeTab``
// เหลือแค่ scroll ที่ต้องจำเอง เพราะ render() ล้าง #view ทิ้งทั้งก้อน

const AUTO_MS = 60 * 1000;
const AUTO_KEY = "adminAutoRefresh";
let autoTimer = null;
let autoBusy = false;      // ยังมีรอบก่อนค้างอยู่ — กันยิงทับ
let autoBlocked = false;   // เจอ 401 แล้ว: หยุดถาวรจนล็อกอินใหม่

/**
 * อ่าน/เขียนสวิตช์ลง localStorage — **คีย์เดียวและเป็น "1"/"0" เท่านั้น**
 * ห้ามเพิ่มอะไรที่เกี่ยวกับผู้ใช้/เซสชัน/เนื้อข้อมูลลงที่นี่
 * (``tests/test_admin.py`` ไล่ดูคีย์ที่ไฟล์นี้ใช้จริงเทียบ allowlist —
 *  เพิ่มคีย์ใหม่แล้วเทสจะแดงจนกว่าจะไปเพิ่มใน allowlist พร้อมเหตุผล)
 */
function autoWanted() {
  try { return localStorage.getItem(AUTO_KEY) !== "0"; }
  catch (error) { return true; }
}

function autoRemember(on) {
  try { localStorage.setItem(AUTO_KEY, on ? "1" : "0"); }
  catch (error) { /* โหมดส่วนตัว/storage ปิด — ไม่จำก็ไม่เป็นไร */ }
}

function autoStatus(text) {
  el("autowhen").textContent = text;
}

function autoStamp() {
  const now = new Date();
  autoStatus("อัปเดตล่าสุด " + now.toLocaleTimeString("th-TH",
    { hour: "2-digit", minute: "2-digit" }));
}

/** อยู่กลางมือผู้ใช้ไหม — ถ้าใช่ ข้ามรอบนี้ไปรอบหน้า ไม่วาดหน้าใหม่ทับ */
function autoWouldInterrupt() {
  const node = document.activeElement;
  if (node && node !== el("autotoggle")) {
    const tag = node.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return true;
    if (node.isContentEditable) return true;
  }
  if (document.querySelector("dialog[open]")) return true;
  return hasDraft();
}

async function autoTick() {
  if (autoBlocked || autoBusy || document.hidden) return;
  if (!adminUser || state === null) return;
  if (autoWouldInterrupt()) return;
  autoBusy = true;
  const top = window.scrollY;
  try {
    await reload();
    autoStamp();
    // render() ล้าง #view ก่อนวาดใหม่ ความสูงหน้าจึงหายไปชั่วขณะและเบราว์เซอร์
    // หนีบ scroll ลงมา — คืนค่าทั้งทันทีและอีกครั้งในเฟรมถัดไปหลัง layout จริง
    window.scrollTo(0, top);
    window.requestAnimationFrame(() => window.scrollTo(0, top));
  } catch (error) {
    if (error && error.message === EXPIRED_TEXT) {
      // api() เปิดกล่องล็อกอินซ้อนให้แล้ว (ไม่รีโหลด ร่างไม่หาย) — ที่นี่แค่
      // หยุด timer ไม่ให้ยิง 401 ซ้ำทุกนาที
      autoBlocked = true;
      autoStop();
      autoStatus("หยุดโหลดเอง — เซสชันหมดอายุ");
    }
    // เน็ตสะดุดชั่วคราว: เงียบไว้ ไม่เด้ง error ข้อความ "อัปเดตล่าสุด" ที่ค้าง
    // อยู่คือสัญญาณเองว่าข้อมูลเก่ากี่นาทีแล้ว
  } finally {
    autoBusy = false;
  }
}

function autoStop() {
  if (autoTimer !== null) {
    window.clearInterval(autoTimer);
    autoTimer = null;
  }
}

function autoStart() {
  autoStop();
  if (autoBlocked || !el("autotoggle").checked || document.hidden) return;
  autoTimer = window.setInterval(autoTick, AUTO_MS);
}

/** โชว์แถบสวิตช์และตั้งค่าตามที่จำไว้ — เรียกทุกครั้งที่ล็อกอินสำเร็จรอบใหม่ */
function autoReveal() {
  el("autobar").hidden = false;
  el("autotoggle").checked = autoWanted();
  autoBlocked = false;
}

/** ผูก listener ของสวิตช์และของ visibilitychange — ครั้งเดียวต่อการเปิดหน้า */
function wireAuto() {
  const toggle = el("autotoggle");
  toggle.addEventListener("change", () => {
    autoRemember(toggle.checked);
    if (toggle.checked) {
      autoBlocked = false;
      autoStart();
    } else {
      autoStop();
    }
  });
  // แท็บถูกซ่อน = หยุด timer ไม่ยิง request ทิ้งเปล่า ๆ กลับมาแล้วเริ่มใหม่
  // และถ้าซ่อนนานเกินหนึ่งรอบ ให้โหลดทันทีหนึ่งครั้ง (ยังผ่านด่านเดิมทุกข้อ)
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { autoStop(); return; }
    autoStart();
    if (autoTimer !== null) autoTick();
  });
}

// ── เริ่มทำงาน ──────────────────────────────────────────────────────────────

function setWho(message, tone) {
  el("whotext").textContent = message;
  el("statedot").className = "dot" + (tone ? " dot--" + tone : "");
}

async function start() {
  wireGate();
  setWho("กำลังตรวจการตั้งค่าของเซิร์ฟเวอร์…");
  let config = null;
  try {
    // GET ตัวเดียวในหน้านี้ และเป็นตัวเดียวที่เรียกได้ก่อนล็อกอิน
    const res = await fetch("/api/admin/config", { credentials: "same-origin" });
    config = await res.json();
  } catch (error) {
    setWho("ติดต่อเซิร์ฟเวอร์ไม่ได้", "off");
    el("view").textContent = "";
    notice("ติดต่อเซิร์ฟเวอร์ไม่ได้", "err",
      "ตรวจว่าเซิร์ฟเวอร์ยังรันอยู่ แล้วโหลดหน้านี้ใหม่");
    return;
  }
  el("view").textContent = "";
  if (config && config.program_code) {
    el("gatesub").textContent = "ผู้ดูแลหลักสูตร " + config.program_code;
  }
  setWho("ยังไม่ได้เข้าสู่ระบบ", "off");
  if (config && config.configured === false) {
    // fail closed: บอกตั้งแต่เปิดหน้า ไม่ใช่ให้คนพิมพ์รหัสก่อนแล้วค่อยรู้ว่า
    // ไม่มีใครเข้าได้อยู่แล้ว
    showGate({
      text: "เซิร์ฟเวอร์ยังไม่มีบัญชีผู้ดูแลที่ใช้งานอยู่ — ล็อกอินจะถูกปฏิเสธทุกคน",
      kind: "warn",
      detail: "ให้ผู้ดูแลสร้างบัญชีที่เครื่องเซิร์ฟเวอร์ด้วยคำสั่ง " +
        "python scripts/admin_user.py --username <ชื่อ>",
    });
    return;
  }
  showGate(null);
}

/** โหลดข้อมูลครั้งแรกหลังล็อกอินผ่าน */
async function afterLogin() {
  renderSkeleton();
  setWho("กำลังโหลดข้อมูล…");
  try {
    await reload();
  } catch (error) {
    setWho("โหลดข้อมูลไม่สำเร็จ", "off");
    el("view").textContent = "";
    notice("โหลดข้อมูลไม่สำเร็จ", "err", error.message);
    return;
  }
  setWho(whoLine(), "on");
  el("refresh").hidden = false;
  el("logout").hidden = false;
  autoReveal();
  autoStamp();
  wireApp();
  autoStart();
  watchSession();
}

function wireApp() {
  if (appWired) return;   // ล็อกอินได้หลายรอบในหน้าเดียว — ผูก listener ครั้งเดียว
  appWired = true;
  el("refresh").addEventListener("click", onRefresh);
  el("logout").addEventListener("click", doLogout);
  wireAuto();
}

async function onRefresh() {
  const refresh = el("refresh");
  setBusy(refresh, true);
  clearNotices();
  try {
    await reload();
    notice("โหลดข้อมูลใหม่แล้ว", "ok");
    autoStamp();
    autoStart();   // กดเองแล้วเริ่มนับ 60 วินาทีใหม่ ไม่ใช่โหลดซ้ำอีกใน 2 วินาที
  } catch (error) {
    notice("โหลดใหม่ไม่สำเร็จ", "err", error.message);
  } finally {
    setBusy(refresh, false);
  }
}

/**
 * ออกจากระบบ — ยิง /logout ให้เซิร์ฟเวอร์ลบ cookie แล้วกลับมาหน้าล็อกอิน
 * ถามก่อนถ้ามีอะไรพิมพ์ค้าง (กดพลาดแล้วเสียของที่พิมพ์ไว้คือเรื่องที่แก้ยาก)
 */
async function doLogout() {
  const button = el("logout");
  if (hasDraft()) {
    const okay = await confirmAction({
      title: "ออกจากระบบเลยไหม",
      text: "ยังมีข้อความที่พิมพ์ค้างอยู่ในฟอร์มและยังไม่ได้กดบันทึก " +
        "ออกจากระบบแล้วข้อความนั้นจะหาย",
      keyline: "ข้อมูลที่บันทึกแล้วไม่หาย — หายเฉพาะที่ยังไม่ได้กดบันทึก",
      yesLabel: "ออกจากระบบ",
    });
    if (!okay) return;
  }
  setBusy(button, true);
  try {
    await fetch("/api/admin/logout", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "same-origin",
      body: "{}",
    });
  } catch (error) {
    /* เซิร์ฟเวอร์ไม่ตอบก็ยังต้องกลับไปหน้าล็อกอิน — cookie จะหมดอายุเองอยู่ดี */
  } finally {
    setBusy(button, false);
  }
  // ล้างของในหน้าให้หมด ไม่ให้ข้อมูลของหลักสูตรค้างอยู่บนจอหลังออกจากระบบ
  autoStop();
  el("autobar").hidden = true;
  autoStatus("ยังไม่ได้โหลดใหม่");
  adminUser = null;
  sessionExpiresAt = null;
  expiryWarned = false;
  state = null;
  chatLogs = null;
  editingKey = null;
  el("view").textContent = "";
  el("tabbar").hidden = true;
  el("refresh").hidden = true;
  el("logout").hidden = true;
  clearNotices();
  setWho("ออกจากระบบแล้ว", "off");
  showGate({
    text: "ออกจากระบบแล้ว",
    kind: "info",
    detail: "เข้าสู่ระบบอีกครั้งเพื่อใช้งานต่อ",
  });
}

start();
</script>
