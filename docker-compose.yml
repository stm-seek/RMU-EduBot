# แอป (FastAPI) + Postgres/pgvector สำหรับรันในเครื่อง (local dev)
#
# ใช้ image pgvector/pgvector ที่มี extension vector มาให้แล้ว
# ไม่ต้อง compile เอง ส่วนแอปสร้างจาก Dockerfile ในโปรเจกต์นี้
#
#   docker compose up -d --build   # ขึ้นทั้ง DB และแอป (ไม่ต้องรัน run.py แยก)
#   docker compose logs -f app     # ดู log ของแอป
#   docker compose logs -f db      # ดูว่า migration รันผ่าน
#
# แก้โค้ดใน app/ หรือ web/ แล้วต้อง build ใหม่: docker compose up -d --build app
#
# migration ใน db/migrations/ + seed ใน db/seed/ จะรัน *อัตโนมัติครั้งแรกที่สร้าง
# volume* (ผ่าน 009z_seed.sh) — ``up -d`` ครั้งเดียวได้ DB ที่พร้อมใช้ ไม่ต้อง psql เอง
# ถ้าแก้ไฟล์ SQL แล้วอยากรันใหม่: docker compose down -v && docker compose up -d
#
# **กับดัก**: ถ้า init ล้มกลางทาง คอนเทนเนอร์จะตาย แล้ว restart: unless-stopped
# ปลุกขึ้นมาใหม่เป็น ``healthy`` ทั้งที่ schema ไม่ครบ (PGDATA ไม่ว่างแล้ว
# Postgres จึงข้าม init ทั้งชุดและไม่มี error ค้างให้เห็น) — ตรวจทุกครั้งด้วย
#   docker compose logs db | Select-String -Pattern "ERROR|FATAL"
#   docker compose exec db psql -U rmubot -d rmu_bot -At -c "select count(*) from information_schema.tables where table_schema='public'"
# ต้องได้ 26 ตาราง
# ชื่อกลุ่มที่โชว์ในหน้า Containers ของ Docker Desktop
# ไม่ตั้งไว้ compose จะใช้ชื่อโฟลเดอร์ (line-bot-jang) และรับแค่ a-z 0-9 - _
name: rmu-edubot

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: rmu_bot_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rmubot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rmubot_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-rmu_bot}
      # ให้ error ภาษาไทยอ่านออก + collation ที่เรียงไทยได้
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
      TZ: Asia/Bangkok
    ports:
      # bind แค่ localhost — ไม่เปิด DB ออกเน็ต
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # ไฟล์ใน docker-entrypoint-initdb.d รันตามลำดับชื่อไฟล์ตอน init ครั้งแรก
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
      # seed ไม่ใช่ migration (generate จาก scraper — ดู db/export_seed.py) แต่
      # 010_electives.sql ต้องเห็นข้อมูลใน courses/curriculum_rules ก่อนถึงจะ
      # เติม group_code และคิด course_id ได้ถูก → mount ไว้ที่ /seed แล้วให้
      # db/migrations/009z_seed.sh เป็นตัวเรียก psql (ลำดับอยู่ระหว่าง 009 กับ 010)
      #
      # **ห้าม** mount ไฟล์ seed ซ้อนเข้า /docker-entrypoint-initdb.d/xxx.sql ตรง ๆ
      # parent ของมันเป็น :ro → Docker สร้าง mountpoint ใหม่ในนั้นไม่ได้ จะขึ้นไม่ติด
      - ./db/seed:/seed:ro
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rmubot} -d ${POSTGRES_DB:-rmu_bot}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  # แอป FastAPI — ขึ้นพร้อม DB ด้วยคำสั่งเดียว
  #
  # **ไม่ได้เรียก run.py** เพราะข้างในคอนเทนเนอร์เป็น Linux ซึ่งไม่มีปัญหา
  # ProactorEventLoop ของ Windows (เหตุผลเต็ม ๆ อยู่ใน docstring ของ run.py)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: rmu_bot_app
    container_name: rmu_bot_app
    restart: unless-stopped
    # env_file เอาค่าจริงทั้งชุดจาก .env (LINE token, LLM key, pepper, ฯลฯ)
    # ค่าใน environment ด้านล่างเขียนทับเฉพาะสองตัวที่ต่างจากตอนรันบน host
    env_file:
      - .env
    environment:
      # ในเครือข่ายของ compose ชื่อ host ของฐานข้อมูลคือชื่อ service = ``db``
      # ไม่ใช่ 127.0.0.1 (นั่นคือตัวคอนเทนเนอร์แอปเอง — จะได้ connection refused)
      DATABASE_URL: postgresql://${POSTGRES_USER:-rmubot}:${POSTGRES_PASSWORD:-rmubot_dev_password}@db:5432/${POSTGRES_DB:-rmu_bot}
      # พอร์ตในคอนเทนเนอร์ยึด 8000 เสมอ แล้วไป map ที่ ports ด้านล่าง
      PORT: "8000"
      PYTHONUTF8: "1"
      TZ: Asia/Bangkok
    ports:
      # ซ้าย = พอร์ตบนเครื่อง (8001 เพราะ 8000 มีโปรเจกต์อื่นยึดอยู่)
      # cloudflared และ .env:PUBLIC_BASE_URL ยังชี้ที่ localhost:8001 เหมือนเดิม
      - "127.0.0.1:${APP_PORT:-8001}:8000"
    depends_on:
      db:
        condition: service_healthy
    # ใช้ urllib ของ python เพราะ image slim ไม่มี curl มาให้
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # pgAdmin — ไม่จำเป็น แต่สะดวกตอน dev
  # เปิดด้วย: docker compose --profile tools up -d
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: rmu_bot_pgadmin
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@local.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
    name: rmu_bot_pgdata
