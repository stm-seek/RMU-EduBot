# ============================================================================
#  ตั้งค่า pytest
#
#  รัน:  python -m pytest -q
#  (บน Windows ตั้ง PYTHONUTF8=1 ก่อน ไม่งั้นข้อความไทยใน output เป็น ?????)
# ============================================================================

[pytest]
# ให้ ``import app`` / ``import tests`` ทำงานทั้งตอนเรียก ``pytest`` เปล่า ๆ
# และ ``python -m pytest`` (อย่างหลังเพิ่ม cwd ให้เอง อย่างแรกไม่เพิ่ม)
pythonpath = .

testpaths = tests

# ไม่ต้องแปะ @pytest.mark.asyncio ทุกตัว — เทสส่วนใหญ่ในโปรเจกต์นี้เป็น async
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# แสดงชื่อเทสที่ล้มเหลวแบบสั้น ๆ อ่านง่ายบนเทอร์มินัลแคบ
addopts = --strict-markers --tb=short
